<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<style>
		.mi-layout {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.material-panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 16px;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
		}

		.material-row {
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
		}

		.material-row .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.material-style-input {
			flex: 1 1 260px;
			max-width: 320px;
			min-width: 240px;
		}

		.material-style-input .form-control {
			max-width: 100%;
			min-width: 0;
		}

		.material-meta-item {
			display: flex;
			align-items: center;
			gap: 8px;
			flex: 1 1 auto;
			min-width: 160px;
		}

		.material-meta-item .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.material-color-select {
			max-width: 140px;
		}

		.material-agree-select {
			flex: 1 1 220px;
			min-width: 200px;
			max-width: 360px;
		}

		.material-search-button {
			width: 140px;
			align-self: stretch;
			min-height: 38px;
		}

		.mi-table thead th {
			font-size: 13px;
			font-weight: 800;
			background: #f9fafb;
			white-space: nowrap;
		}

		.mi-table tbody td {
			font-size: 13px;
			vertical-align: middle;
			white-space: nowrap;
		}

		.mi-placeholder {
			text-align: center;
			color: #6b7280;
		}

		.data-table th,
		.data-table td {
			text-align: center;
			vertical-align: middle;
		}

		.data-table input {
			text-align: center;
		}
	</style>

	<div class="mb-3">
		<h4 class="fw-bold mb-1">원부자재 입고 등록</h4>
		<p class="text-muted mb-0">품번/색상/생산합의 기준으로 입고 대상 목록을 조회하세요.</p>
	</div>

	<div class="mi-layout">
		<div class="material-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="fw-bold mb-0">검색/선택</h6>
				<small class="text-muted">품번 확인 후 색상과 생산합의코드를 선택하세요.</small>
			</div>
			<div class="material-row form-row mb-2">
				<label class="form-label fw-bold mb-0">품번</label>
				<input type="hidden" id="mi-styles-id">
				<div class="material-style-input input-group">
					<input type="text" id="mi-style-input" class="form-control" placeholder="품번을 입력하세요">
					<button type="button" class="btn btn--outline" id="mi-verify-button">품번 확인</button>
				</div>
			</div>
			<div class="material-row form-row justify-content-between">
				<div class="material-meta-item">
					<label class="form-label fw-bold mb-0">색상</label>
					<select id="mi-color-select" class="form-select material-color-select" disabled>
						<option value="">색상을 선택하세요</option>
					</select>
				</div>
				<div class="material-meta-item">
					<label class="form-label fw-bold mb-0">생산합의코드</label>
					<select id="mi-agreement-select" class="form-select material-agree-select" disabled>
						<option value="">생산합의 코드를 선택하세요</option>
					</select>
				</div>
				<div class="actions ms-auto">
					<button type="button" class="btn btn--primary material-search-button"
						id="mi-search-button">조회</button>
				</div>
			</div>
			<div id="mi-search-message" class="mt-2"></div>
		</div>

		<div class="material-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<div>
					<h6 class="fw-bold mb-0">입고 대상 목록</h6>
					<small class="text-muted">입고량을 입력하고 저장을 눌러주세요.</small>
				</div>
				<div class="actions">
					<button type="button" class="btn btn--primary" id="mi-save-button">저장</button>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-bordered align-middle mi-table data-table">
					<thead class="table-light">
						<tr>
							<th>품번</th>
							<th>생산합의코드</th>
							<th>색상</th>
							<th>원부자재구분</th>
							<th>자재명칭</th>
							<th>용도</th>
							<th>자재규격</th>
							<th>자재색상</th>
							<th>소요량단위</th>
							<th>1매소요량</th>
							<th>자재처</th>
							<th>생산담당</th>
							<th>발주단위</th>
							<th>단가</th>
							<th>발주량</th>
							<th>기입고량</th>
							<th>입고량</th>
						</tr>
					</thead>
					<tbody id="mi-table-body">
						<tr>
							<td colspan="17" class="mi-placeholder">품번/색상/생산합의 조건을 선택한 뒤 조회하세요.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const styleIdInput = document.getElementById('mi-styles-id');
			const styleCodeInput = document.getElementById('mi-style-input');
			const colorSelect = document.getElementById('mi-color-select');
			const agreeSelect = document.getElementById('mi-agreement-select');
			const searchButton = document.getElementById('mi-search-button');
			const verifyButton = document.getElementById('mi-verify-button');
			const saveButton = document.getElementById('mi-save-button');
			const tableBody = document.getElementById('mi-table-body');
			const messageBox = document.getElementById('mi-search-message');
			let styleVerified = false;

			styleCodeInput.addEventListener('input', () => {
				styleIdInput.value = '';
				styleVerified = false;
				renderSelectOptions(colorSelect, [], '색상 선택');
				renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
				colorSelect.disabled = true;
				agreeSelect.disabled = true;
				clearMessage();
			});

			function loadSelectionOptions(styleCode) {
				fetch(`/production/material-inbound/options?styleCode=${encodeURIComponent(styleCode)}`)
					.then(res => res.json())
					.then(data => {
						renderSelectOptions(colorSelect, data.colors, '색상 선택');
						renderSelectOptions(agreeSelect, data.agreements, '생산합의코드 선택');
						colorSelect.disabled = false;
						agreeSelect.disabled = false;
					})
					.catch(() => {
						renderSelectOptions(colorSelect, [], '색상 선택');
						renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
						colorSelect.disabled = false;
						agreeSelect.disabled = false;
					});
			}

			function renderSelectOptions(selectEl, options, placeholder) {
				selectEl.innerHTML = '';
				const defaultOpt = document.createElement('option');
				defaultOpt.value = '';
				defaultOpt.textContent = placeholder;
				selectEl.appendChild(defaultOpt);
				(options || []).forEach(opt => {
					const optionEl = document.createElement('option');
					optionEl.value = opt;
					optionEl.textContent = opt;
					selectEl.appendChild(optionEl);
				});
			}

			function resetTable(message) {
				tableBody.innerHTML = `<tr><td colspan="17" class="mi-placeholder">${message}</td></tr>`;
			}

			function setMessage(type, text) {
				messageBox.innerHTML = `<div class="alert alert-${type} py-2 mb-0">${text}</div>`;
			}

			function clearMessage() {
				messageBox.innerHTML = '';
			}

			async function verifyStyleCode() {
				clearMessage();
				const styleCode = styleCodeInput.value.trim();
				if (!styleCode) {
					setMessage('danger', '품번을 입력하세요.');
					styleVerified = false;
					return;
				}
				const exists = await checkStyleExists(styleCode);
				if (!exists) {
					setMessage('danger', '존재하지 않는 품번입니다.');
					styleVerified = false;
					renderSelectOptions(colorSelect, [], '색상 선택');
					renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
					colorSelect.disabled = true;
					agreeSelect.disabled = true;
					return;
				}
				styleVerified = true;
				setMessage('success', '품번이 확인되었습니다.');
				loadSelectionOptions(styleCode);
			}

			async function checkStyleExists(styleCode) {
				try {
					const res = await fetch(`/production/material-inbound/styles?keyword=${encodeURIComponent(styleCode)}`);
					if (!res.ok) {
						return true;
					}
					const list = await res.json();
					return (list || []).some(item => (item.styleCode || '').toLowerCase() === styleCode.toLowerCase());
				} catch (e) {
					return true;
				}
			}

			searchButton.addEventListener('click', async () => {
				clearMessage();
				const styleCode = styleCodeInput.value.trim();
				if (!styleVerified) {
					setMessage('danger', '품번 확인 후 조회하세요.');
					resetTable('품번을 확인한 뒤 조회하세요.');
					return;
				}
				if (!styleCode || !colorSelect.value || !agreeSelect.value) {
					setMessage('danger', '품번/색상/생산합의코드를 선택하세요.');
					resetTable('품번/색상/생산합의 조건을 선택한 뒤 조회하세요.');
					return;
				}
				await loadMaterials(styleCode);
			});

			async function loadMaterials(styleCode) {
				const url = `/production/material-inbound/list?styleCode=${encodeURIComponent(styleCode)}&prdAgreeCode=${encodeURIComponent(agreeSelect.value)}&colorCode=${encodeURIComponent(colorSelect.value)}`;
				try {
					const res = await fetch(url);
					const data = await res.json().catch(() => ({}));
					if (!res.ok) {
						throw new Error(data?.message || '조회 중 오류가 발생했습니다.');
					}
					renderTable(data);
					if (data && data.length > 0) {
						setMessage('success', `총 ${data.length}건 조회되었습니다.`);
						return;
					}
					if (styleCode) {
						const exists = await checkStyleExists(styleCode);
						if (!exists) {
							setMessage('danger', '존재하지 않는 품번입니다.');
							return;
						}
					}
					setMessage('warning', '조회된 데이터가 없습니다.');
				} catch (e) {
					const rawMessage = e?.message;
					const message = rawMessage && rawMessage.includes('원인:')
						? rawMessage
						: `조회 중 오류가 발생했습니다. (원인: ${rawMessage || '알 수 없는 오류'})`;
					renderTable([]);
					setMessage('danger', message);
				}
			}

			function renderTable(list) {
				tableBody.innerHTML = '';
				if (!list || list.length === 0) {
					resetTable('조회된 데이터가 없습니다.');
					return;
				}
				list.forEach(item => {
					const requiredQty = formatQuantity(item.requiredQuantity ?? item.inboundQuantity ?? item.orderQuantity);
					const inboundQty = requiredQty;
					const row = document.createElement('tr');
					row.dataset.mOrderCode = item.mOrderCode || '';
					row.dataset.orderUom = item.orderUom || '';
					row.dataset.unitPrice = item.unitPrice || '';
					row.innerHTML = `
						<td>${item.styleCode || '-'}</td>
						<td>${item.agreementMonth || item.prdAgreeCode || '-'}</td>
						<td>${item.colorCode || '-'}</td>
						<td>${item.category || '-'}</td>
						<td>${item.materialName || '-'}</td>
						<td>${item.materialUsage || '-'}</td>
						<td>${item.spec || '-'}</td>
						<td>${item.materialColor || '-'}</td>
						<td>${item.uom || '-'}</td>
						<td>${formatQuantity(item.qtyPerPiece)}</td>
						<td>${item.supplierName || item.supplierCode || '-'}</td>
						<td>${item.productionManager || '-'}</td>
						<td>${item.orderUom || '-'}</td>
						<td>${formatPrice(item.unitPrice)}</td>
						<td>${requiredQty}</td>
						<td>${inboundQty}</td>
						<td><input type="number" class="form-control form-control-sm mi-qty-input" min="0" step="0.001" value="0"></td>
					`;
					tableBody.appendChild(row);
				});
			}

			saveButton.addEventListener('click', () => {
				const rows = Array.from(tableBody.querySelectorAll('tr[data-m-order-code]'));
				const items = [];
				rows.forEach(row => {
					const qty = parseFloat(row.querySelector('.mi-qty-input')?.value || '0');
					if (!isNaN(qty) && qty > 0) {
						items.push({
							mOrderCode: row.dataset.mOrderCode || null,
							quantity: qty,
							orderUom: row.dataset.orderUom || null,
							unitPrice: row.dataset.unitPrice ? Number(row.dataset.unitPrice) : null
						});
					}
				});

				if (items.length === 0) {
					alert('입고량을 입력하세요.');
					return;
				}

				const payload = {
					stylesId: styleIdInput.value,
					styleCode: styleCodeInput.value,
					prdAgreeCode: agreeSelect.value,
					colorCode: colorSelect.value,
					items
				};

				fetch('/production/material-inbound/save', {
					method: 'POST',
					headers: {'Content-Type': 'application/json'},
					body: JSON.stringify(payload)
				})
					.then(async res => {
						const data = await res.json().catch(() => ({}));
						if (!res.ok) {
							const errorMessage = data?.message || '입고 등록에 실패했습니다.';
							throw new Error(errorMessage);
						}
						return data;
					})
					.then(data => {
						if (data.success) {
							alert(data.message || '입고가 등록되었습니다.');
							loadMaterials(styleCodeInput.value.trim());
						} else {
							alert(data.message || '입고 등록에 실패했습니다.');
						}
					})
					.catch((e) => {
						const rawMessage = e?.message;
						const message = rawMessage && rawMessage.includes('원인:')
							? rawMessage
							: `입고 등록에 실패했습니다. (원인: ${rawMessage || '알 수 없는 오류'})`;
						alert(message);
					});
			});

			function formatQuantity(value) {
				const num = Number(value);
				const safe = isNaN(num) ? 0 : num;
				return safe.toLocaleString(undefined, {minimumFractionDigits: 3, maximumFractionDigits: 3});
			}

			function formatPrice(value) {
				const num = Number(value);
				const safe = isNaN(num) ? 0 : num;
				return safe.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
			}

			verifyButton.addEventListener('click', verifyStyleCode);
		});
	</script>
</div>
