<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<style>
		.wo-layout {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.wo-panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 16px;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
		}

		.wo-row {
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
		}

		.wo-row .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.wo-style-input {
			flex: 1 1 260px;
			max-width: 320px;
			min-width: 240px;
		}

		.wo-meta-item {
			display: flex;
			align-items: center;
			gap: 8px;
			flex: 1 1 auto;
			min-width: 160px;
		}

		.wo-color-select {
			max-width: 140px;
		}

		.wo-agree-select {
			flex: 1 1 220px;
			min-width: 200px;
			max-width: 360px;
		}

		.wo-search-button {
			width: 140px;
			align-self: stretch;
			min-height: 38px;
		}

		.wo-grid {
			display: grid;
			grid-template-columns: 1.1fr 1fr;
			gap: 16px;
		}

		.wo-table thead th {
			font-size: 13px;
			font-weight: 800;
			background: #f9fafb;
			white-space: nowrap;
		}

		.wo-table tbody td {
			font-size: 13px;
			vertical-align: middle;
			white-space: nowrap;
		}

		.wo-placeholder {
			text-align: center;
			color: #6b7280;
		}

		.wo-row-selected td {
			background-color: #e5e7eb !important;
		}

		.wo-row-disabled {
			opacity: 0.5;
		}

		.wo-input-group .form-control {
			min-width: 140px;
		}

		.wo-input-group {
			flex-wrap: nowrap;
		}

		.wo-input-group .btn {
			white-space: nowrap;
		}

		@media (max-width: 1200px) {
			.wo-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>

	<div class="mb-3">
		<h4 class="fw-bold mb-1">작업지시</h4>
		<p class="text-muted mb-0">품번/색상/생산합의 기준으로 작업지시를 등록하세요.</p>
	</div>

	<div class="wo-layout">
		<div class="wo-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="fw-bold mb-0">검색/선택</h6>
				<small class="text-muted">품번 확인 후 색상과 생산합의코드를 선택하세요.</small>
			</div>
			<div class="wo-row form-row mb-2">
				<label class="form-label fw-bold mb-0">품번</label>
				<input type="hidden" id="wo-styles-id">
				<div class="wo-style-input input-group">
					<input type="text" id="wo-style-input" class="form-control" placeholder="품번을 입력하세요">
					<button type="button" class="btn btn--outline" id="wo-verify-button">품번 확인</button>
				</div>
			</div>
			<div class="wo-row form-row justify-content-between">
				<div class="wo-meta-item">
					<label class="form-label fw-bold mb-0">색상</label>
					<select id="wo-color-select" class="form-select wo-color-select" disabled>
						<option value="">색상을 선택하세요</option>
					</select>
				</div>
				<div class="wo-meta-item">
					<label class="form-label fw-bold mb-0">생산합의코드</label>
					<select id="wo-agreement-select" class="form-select wo-agree-select" disabled>
						<option value="">생산합의 코드를 선택하세요</option>
					</select>
				</div>
				<div class="actions ms-auto">
					<button type="button" class="btn btn--primary wo-search-button" id="wo-search-button">조회</button>
				</div>
			</div>
			<div id="wo-search-message" class="mt-2"></div>
		</div>

		<div class="wo-grid">
			<div class="wo-panel">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h6 class="fw-bold mb-0">생산합의 목록</h6>
					<small class="text-muted">행을 선택한 뒤 작업지시를 등록하세요.</small>
				</div>
				<div class="table-responsive">
					<table class="table table-bordered align-middle wo-table data-table">
						<thead class="table-light">
							<tr>
								<th>품번</th>
								<th>생산합의코드</th>
								<th>색상</th>
								<th>합의량</th>
								<th>생산처</th>
								<th>작업지시</th>
							</tr>
						</thead>
						<tbody id="wo-left-body">
							<tr>
								<td colspan="6" class="wo-placeholder">품번/색상/생산합의 조건을 선택한 뒤 조회하세요.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="wo-panel">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<div>
						<h6 class="fw-bold mb-0">작업지시 입력/목록</h6>
						<small class="text-muted">생산처/납기일/납품장소를 입력하세요.</small>
					</div>
					<div class="actions">
						<button type="button" class="btn btn--primary" id="wo-save-button">저장</button>
					</div>
				</div>
				<div class="table-responsive">
					<table class="table table-bordered align-middle wo-table data-table">
						<thead class="table-light">
							<tr>
								<th>품번</th>
								<th>생산합의코드</th>
								<th>색상</th>
								<th>합의량</th>
								<th>생산처</th>
								<th>납기일</th>
								<th>납품장소</th>
							</tr>
						</thead>
						<tbody id="wo-right-body">
							<tr>
								<td colspan="7" class="wo-placeholder">좌측 목록을 선택하면 입력 항목이 표시됩니다.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const styleIdInput = document.getElementById('wo-styles-id');
			const styleCodeInput = document.getElementById('wo-style-input');
			const colorSelect = document.getElementById('wo-color-select');
			const agreeSelect = document.getElementById('wo-agreement-select');
			const searchButton = document.getElementById('wo-search-button');
			const verifyButton = document.getElementById('wo-verify-button');
			const leftBody = document.getElementById('wo-left-body');
			const messageBox = document.getElementById('wo-search-message');
			let styleVerified = false;
			let cachedAgreements = [];

			styleCodeInput.addEventListener('input', () => {
				styleIdInput.value = '';
				styleVerified = false;
				cachedAgreements = [];
				renderSelectOptions(colorSelect, [], '색상을 선택하세요');
				renderSelectOptions(agreeSelect, [], '생산합의 코드를 선택하세요');
				colorSelect.disabled = true;
				agreeSelect.disabled = true;
				clearMessage();
				resetTable('품번/색상/생산합의 조건을 선택한 뒤 조회하세요.');
			});

			colorSelect.addEventListener('change', () => {
				if (!colorSelect.value) {
					renderSelectOptions(agreeSelect, [], '생산합의 코드를 선택하세요');
					agreeSelect.disabled = true;
					return;
				}
				renderSelectOptions(agreeSelect, cachedAgreements, '생산합의 코드를 선택하세요');
				agreeSelect.disabled = false;
			});

			function renderSelectOptions(selectEl, options, placeholder) {
				selectEl.innerHTML = '';
				const defaultOpt = document.createElement('option');
				defaultOpt.value = '';
				defaultOpt.textContent = placeholder;
				selectEl.appendChild(defaultOpt);
				(options || []).forEach(opt => {
					const optionEl = document.createElement('option');
					optionEl.value = opt;
					optionEl.textContent = opt;
					selectEl.appendChild(optionEl);
				});
			}

			function resetTable(message) {
				leftBody.innerHTML = `<tr><td colspan="6" class="wo-placeholder">${message}</td></tr>`;
			}

			function setMessage(type, text) {
				messageBox.innerHTML = `<div class="alert alert-${type} py-2 mb-0">${text}</div>`;
			}

			function clearMessage() {
				messageBox.innerHTML = '';
			}

			async function checkStyleExists(styleCode) {
				try {
					const res = await fetch(`/production/work-orders/styles?keyword=${encodeURIComponent(styleCode)}`);
					if (!res.ok) {
						return true;
					}
					const list = await res.json();
					return (list || []).some(item => (item.styleCode || '').toLowerCase() === styleCode.toLowerCase());
				} catch (e) {
					return true;
				}
			}

			async function verifyStyleCode() {
				clearMessage();
				const styleCode = styleCodeInput.value.trim();
				if (!styleCode) {
					setMessage('danger', '품번을 입력하세요.');
					styleVerified = false;
					return;
				}
				const exists = await checkStyleExists(styleCode);
				if (!exists) {
					setMessage('danger', '존재하지 않는 품번입니다.');
					styleVerified = false;
					renderSelectOptions(colorSelect, [], '색상을 선택하세요');
					renderSelectOptions(agreeSelect, [], '생산합의 코드를 선택하세요');
					colorSelect.disabled = true;
					agreeSelect.disabled = true;
					return;
				}

				styleVerified = true;
				setMessage('success', '품번이 확인되었습니다.');
				loadSelectionOptions(styleCode);
			}

			function loadSelectionOptions(styleCode) {
				fetch(`/production/work-orders/options?styleCode=${encodeURIComponent(styleCode)}`)
					.then(res => res.json())
					.then(data => {
						styleIdInput.value = data.stylesId || '';
						renderSelectOptions(colorSelect, data.colors, '색상을 선택하세요');
						cachedAgreements = data.agreements || [];
						renderSelectOptions(agreeSelect, [], '생산합의 코드를 선택하세요');
						colorSelect.disabled = false;
						agreeSelect.disabled = true;
					})
					.catch(() => {
						renderSelectOptions(colorSelect, [], '색상을 선택하세요');
						renderSelectOptions(agreeSelect, [], '생산합의 코드를 선택하세요');
						colorSelect.disabled = false;
						agreeSelect.disabled = true;
					});
			}

			searchButton.addEventListener('click', async () => {
				clearMessage();
				const styleCode = styleCodeInput.value.trim();
				if (!styleVerified) {
					setMessage('danger', '품번 확인 후 조회하세요.');
					resetTable('품번을 확인한 뒤 조회하세요.');
					return;
				}
				if (!styleCode || !colorSelect.value || !agreeSelect.value) {
					setMessage('danger', '품번/색상/생산합의코드를 선택하세요.');
					resetTable('품번/색상/생산합의 조건을 선택한 뒤 조회하세요.');
					return;
				}
				await loadAgreements(styleCode);
			});

			async function loadAgreements(styleCode) {
				const url = `/production/work-orders/list?styleCode=${encodeURIComponent(styleCode)}&prdAgreeCode=${encodeURIComponent(agreeSelect.value)}&colorCode=${encodeURIComponent(colorSelect.value)}`;
				try {
					const res = await fetch(url);
					const data = await res.json().catch(() => ({}));
					if (!res.ok) {
						throw new Error(data?.message || '조회 중 오류가 발생했습니다.');
					}
					renderTable(data);
					if (data && data.length > 0) {
						setMessage('success', `총 ${data.length}건 조회되었습니다.`);
						return;
					}
					setMessage('warning', '조회된 데이터가 없습니다.');
				} catch (e) {
					const rawMessage = e?.message;
					const message = rawMessage && rawMessage.includes('원인:')
						? rawMessage
						: `조회 중 오류가 발생했습니다. (원인: ${rawMessage || '알 수 없는 오류'})`;
					renderTable([]);
					setMessage('danger', message);
				}
			}

			function renderTable(list) {
				leftBody.innerHTML = '';
				if (!list || list.length === 0) {
					resetTable('조회된 데이터가 없습니다.');
					return;
				}
				list.forEach(item => {
					const row = document.createElement('tr');
					const statusLabel = item.status || (item.ordered ? 'ACTIVE' : '-');
					row.innerHTML = `
							<td>${item.styleCode || '-'}</td>
							<td>${item.prdAgreeCode || '-'}</td>
							<td>${item.colorCode || '-'}</td>
							<td>${formatQuantity(item.agreementQuantity)}</td>
							<td>${item.producerName || item.producerCode || '-'}</td>
							<td>${statusLabel}</td>
						`;
					leftBody.appendChild(row);
				});
			}

			function formatQuantity(value) {
				const num = Number(value);
				const safe = isNaN(num) ? 0 : num;
				return safe.toLocaleString(undefined, {minimumFractionDigits: 3, maximumFractionDigits: 3});
			}

			verifyButton.addEventListener('click', verifyStyleCode);
		});
	</script>
</div>
