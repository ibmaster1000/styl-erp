<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<style>
		.moout-layout {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.material-panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 16px;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
		}

		.material-row {
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		.material-row .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.material-style-input {
			flex: 1 1 260px;
			max-width: 320px;
			min-width: 240px;
		}

		.material-style-input .form-control {
			max-width: 100%;
			min-width: 0;
		}

		.material-meta-item {
			display: flex;
			align-items: center;
			gap: 8px;
			flex: 1 1 auto;
			min-width: 200px;
		}

		.material-meta-item .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.material-color-select {
			max-width: 160px;
		}

		.material-agree-select {
			flex: 1 1 260px;
			min-width: 240px;
			max-width: 520px;
		}

		.moout-date-input {
			min-width: 180px;
			max-width: 220px;
		}

		.material-search-button {
			width: 140px;
			align-self: stretch;
			min-height: 38px;
		}

		.moout-table thead th {
			font-size: 13px;
			font-weight: 800;
			background: #f9fafb;
			white-space: nowrap;
		}

		.moout-table tbody td {
			font-size: 13px;
			vertical-align: middle;
			white-space: nowrap;
		}

		.moout-placeholder {
			text-align: center;
			color: #6b7280;
		}

		.data-table th,
		.data-table td {
			text-align: center;
			vertical-align: middle;
		}

		.data-table input,
		.data-table select {
			text-align: center;
		}
	</style>

	<div class="mb-3">
		<h4 class="fw-bold mb-1">원부자재 출고 등록</h4>
		<p class="text-muted mb-0">품번 또는 출고일 기준으로 DB 목록을 조회하세요.</p>
	</div>

	<div class="moout-layout">
		<div class="material-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="fw-bold mb-0">검색/선택</h6>
				<small class="text-muted">품번 또는 날짜 중 하나만 입력해도 조회할 수 있습니다.</small>
			</div>
			<div class="material-row form-row mb-2">
				<label class="form-label fw-bold mb-0">품번</label>
				<input type="hidden" id="mout-styles-id">
				<div class="material-style-input">
					<input type="text" id="mout-style-input" class="form-control" placeholder="품번을 입력하세요">
				</div>
				<span class="fw-bold text-muted">또는</span>
				<div class="material-meta-item">
					<label class="form-label fw-bold mb-0">출고일</label>
					<input type="date" id="mout-date-input" class="form-control moout-date-input">
				</div>
				<div class="actions">
					<button type="button" class="btn btn--primary material-search-button" id="mout-search-button">조회</button>
				</div>
			</div>
			<div class="material-row form-row">
				<div class="material-meta-item">
					<label class="form-label fw-bold mb-0">색상</label>
					<select id="mout-color-select" class="form-select material-color-select" disabled>
						<option value="">색상을 선택하세요</option>
					</select>
				</div>
				<div class="material-meta-item">
					<label class="form-label fw-bold mb-0">생산합의코드</label>
					<select id="mout-agreement-select" class="form-select material-agree-select" disabled>
						<option value="">생산합의 코드를 선택하세요</option>
					</select>
				</div>
			</div>
			<div id="mout-search-message" class="mt-2"></div>
		</div>

		<div class="material-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<div>
					<h6 class="fw-bold mb-0">출고 대상 목록</h6>
					<small class="text-muted">입고량-기출고량보다 많은 출고량은 저장이 차단됩니다.</small>
				</div>
				<div class="actions">
					<button type="button" class="btn btn--primary" id="mout-save-button">저장</button>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-bordered align-middle moout-table data-table">
					<thead class="table-light">
						<tr>
							<th>품번</th>
							<th>색상</th>
							<th>합의월</th>
							<th>원부자재구분</th>
							<th>자재명칭</th>
							<th>용도</th>
							<th>자재규격</th>
							<th>자재색상</th>
							<th>소요량단위</th>
							<th>1매소요량</th>
							<th>자재처</th>
							<th>생산담당</th>
							<th>발주단위</th>
							<th>단가</th>
							<th>발주량</th>
							<th>입고량</th>
							<th>기출고량</th>
							<th>출고량</th>
							<th>생산처</th>
						</tr>
					</thead>
					<tbody id="mout-table-body">
						<tr>
							<td colspan="19" class="moout-placeholder">품번 또는 출고일을 입력한 뒤 조회하세요.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		const factoryOptions = /*[[${factories}]]*/ [];

		document.addEventListener('DOMContentLoaded', () => {
			const styleIdInput = document.getElementById('mout-styles-id');
			const styleCodeInput = document.getElementById('mout-style-input');
			const colorSelect = document.getElementById('mout-color-select');
			const agreeSelect = document.getElementById('mout-agreement-select');
			const dateInput = document.getElementById('mout-date-input');
			const searchButton = document.getElementById('mout-search-button');
			const saveButton = document.getElementById('mout-save-button');
			const tableBody = document.getElementById('mout-table-body');
			const messageBox = document.getElementById('mout-search-message');

			styleCodeInput.addEventListener('change', () => {
				const styleCode = styleCodeInput.value.trim();
				styleIdInput.value = '';
				if (styleCode) {
					colorSelect.disabled = false;
					agreeSelect.disabled = false;
					loadSelectionOptions(styleCode);
					return;
				}
				renderSelectOptions(colorSelect, [], '색상 선택');
				renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
				colorSelect.disabled = true;
				agreeSelect.disabled = true;
			});

			function loadSelectionOptions(styleCode) {
				fetch(`/production/material-outbound/options?styleCode=${encodeURIComponent(styleCode)}`)
					.then(res => res.json())
					.then(data => {
						renderSelectOptions(colorSelect, data.colors, '색상 선택');
						renderSelectOptions(agreeSelect, data.agreements, '생산합의코드 선택');
					})
					.catch(() => {
						renderSelectOptions(colorSelect, [], '색상 선택');
						renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
					});
			}

			function renderSelectOptions(selectEl, options, placeholder) {
				selectEl.innerHTML = '';
				const defaultOpt = document.createElement('option');
				defaultOpt.value = '';
				defaultOpt.textContent = placeholder;
				selectEl.appendChild(defaultOpt);
				(options || []).forEach(opt => {
					const optionEl = document.createElement('option');
					optionEl.value = opt;
					optionEl.textContent = opt;
					selectEl.appendChild(optionEl);
				});
			}

			function resetTable(message) {
				tableBody.innerHTML = `<tr><td colspan="19" class="moout-placeholder">${message}</td></tr>`;
			}

			function setMessage(type, text) {
				messageBox.innerHTML = `<div class="alert alert-${type} py-2 mb-0">${text}</div>`;
			}

			function clearMessage() {
				messageBox.innerHTML = '';
			}

			async function checkStyleExists(styleCode) {
				try {
					const res = await fetch(`/production/material-outbound/styles?keyword=${encodeURIComponent(styleCode)}`);
					if (!res.ok) {
						return true;
					}
					const list = await res.json();
					return (list || []).some(item => (item.styleCode || '').toLowerCase() === styleCode.toLowerCase());
				} catch (e) {
					return true;
				}
			}

			searchButton.addEventListener('click', async () => {
				clearMessage();
				const styleCode = styleCodeInput.value.trim();
				const tranDate = dateInput.value;
				if (!styleCode && !tranDate) {
					setMessage('danger', '품번 또는 날짜 중 하나는 반드시 입력하세요.');
					resetTable('품번 또는 출고일을 입력한 뒤 조회하세요.');
					return;
				}
				await loadMaterials(styleCode, tranDate);
			});

			async function loadMaterials(styleCode, tranDate) {
				const url = `/production/material-outbound/tx-list?styleCode=${encodeURIComponent(styleCode)}&tranDate=${encodeURIComponent(tranDate)}`;
				try {
					const res = await fetch(url);
					const list = await res.json();
					renderTable(list);
					if (list && list.length > 0) {
						setMessage('success', `총 ${list.length}건 조회되었습니다.`);
						return;
					}
					if (styleCode) {
						const exists = await checkStyleExists(styleCode);
						if (!exists) {
							setMessage('danger', '존재하지 않는 품번입니다.');
							return;
						}
					}
					setMessage('warning', '조회된 데이터가 없습니다.');
				} catch (e) {
					renderTable([]);
					setMessage('danger', '조회 중 오류가 발생했습니다.');
				}
			}

			function renderTable(list) {
				tableBody.innerHTML = '';
				if (!list || list.length === 0) {
					resetTable('조회된 데이터가 없습니다.');
					return;
				}
				list.forEach(item => {
					const inbound = safeNumber(item.inboundQuantity);
					const outbound = safeNumber(item.outboundQuantity);
					const available = Math.max(inbound - outbound, 0);
					const row = document.createElement('tr');
					row.dataset.bomId = item.bomId || '';
					row.dataset.orderUom = item.orderUom || '';
					row.dataset.unitPrice = item.unitPrice || '';
					row.dataset.available = available;
					row.innerHTML = `
						<td>${item.styleCode || '-'}</td>
						<td>${item.colorCode || '-'}</td>
						<td>${item.agreementMonth || item.prdAgreeCode || '-'}</td>
						<td>${item.category || '-'}</td>
						<td>${item.materialName || '-'}</td>
						<td>${item.materialUsage || '-'}</td>
						<td>${item.spec || '-'}</td>
						<td>${item.materialColor || '-'}</td>
						<td>${item.uom || '-'}</td>
						<td>${formatDecimal(item.qtyPerPiece)}</td>
						<td>${item.supplierName || item.supplierCode || '-'}</td>
						<td>${item.productionManager || '-'}</td>
						<td>${item.orderUom || '-'}</td>
						<td>${formatDecimal(item.unitPrice)}</td>
						<td>${formatDecimal(item.orderQuantity)}</td>
						<td>${formatDecimal(item.inboundQuantity)}</td>
						<td>${formatDecimal(item.outboundQuantity)}</td>
						<td><input type="number" class="form-control form-control-sm mout-qty-input" min="0" step="0.01" value="0"></td>
						<td>${renderFactorySelect()}</td>
					`;
					const qtyInput = row.querySelector('.mout-qty-input');
					qtyInput.addEventListener('input', () => {
						const val = parseFloat(qtyInput.value || '0');
						if (!isNaN(val) && val > available) {
							alert('출고 가능 수량을 초과했습니다.');
							qtyInput.value = available > 0 ? available : 0;
						}
					});
					tableBody.appendChild(row);
				});
			}

			function renderFactorySelect() {
				if (!factoryOptions || factoryOptions.length === 0) {
					return '<input type="text" class="form-control form-control-sm mout-factory-input" placeholder="생산처를 입력하세요">';
				}
				const options = factoryOptions.map(opt => `<option value="${opt.code}">${opt.name || opt.code}</option>`).join('');
				return `<select class="form-select form-select-sm mout-factory-input"><option value="">선택</option>${options}</select>`;
			}

			saveButton.addEventListener('click', () => {
				const rows = Array.from(tableBody.querySelectorAll('tr[data-bom-id]'));
				const items = [];
				let hasValidationError = false;

				rows.forEach(row => {
					const qty = parseFloat(row.querySelector('.mout-qty-input')?.value || '0');
					if (qty > 0) {
						const available = parseFloat(row.dataset.available || '0');
						if (qty > available) {
							hasValidationError = true;
							return;
						}
						const factoryInput = row.querySelector('.mout-factory-input');
						const factoryCode = factoryInput?.value || '';
						if (!factoryCode) {
							hasValidationError = true;
							return;
						}
						items.push({
							bomId: row.dataset.bomId ? Number(row.dataset.bomId) : null,
							quantity: qty,
							orderUom: row.dataset.orderUom || null,
							unitPrice: row.dataset.unitPrice ? Number(row.dataset.unitPrice) : null,
							factoryCode
						});
					}
				});

				if (hasValidationError) {
					alert('출고량 또는 생산처를 확인하세요.');
					return;
				}
				if (items.length === 0) {
					alert('출고량을 입력하세요.');
					return;
				}

				const payload = {
					stylesId: styleIdInput.value,
					styleCode: styleCodeInput.value,
					prdAgreeCode: agreeSelect.value,
					colorCode: colorSelect.value,
					tranDate: dateInput.value || null,
					items
				};

				fetch('/production/material-outbound/save', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload)
				})
					.then(res => res.json())
					.then(data => {
						if (data.success) {
							alert('출고 저장이 완료되었습니다.');
							loadMaterials(styleCodeInput.value.trim(), dateInput.value);
						} else {
							alert('출고 저장에 실패했습니다.');
						}
					})
					.catch(() => alert('출고 저장 중 오류가 발생했습니다.'));
			});

			function formatDecimal(value) {
				if (value === null || value === undefined) {
					return '-';
				}
				const num = Number(value);
				return isNaN(num) ? '-' : num.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
			}

			function safeNumber(value) {
				const num = Number(value);
				return isNaN(num) ? 0 : num;
			}
		});
		/*]]>*/
	</script>
</div>
