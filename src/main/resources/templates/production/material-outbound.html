<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<style>
		.moout-layout {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.material-panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 16px;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
		}

		.material-row {
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
		}

		.material-row .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.material-style-input {
			flex: 1 1 260px;
			max-width: 320px;
			min-width: 240px;
		}

		.material-style-input .form-control {
			max-width: 100%;
			min-width: 0;
		}

		.material-meta-item {
			display: flex;
			align-items: center;
			gap: 8px;
			flex: 1 1 auto;
			min-width: 160px;
		}

		.material-meta-item .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.material-color-select {
			max-width: 140px;
		}

		.material-agree-select {
			flex: 1 1 220px;
			min-width: 200px;
			max-width: 360px;
		}

		.material-search-button {
			width: 140px;
			align-self: stretch;
			min-height: 38px;
		}

		.moout-table thead th {
			font-size: 13px;
			font-weight: 800;
			background: #f9fafb;
			white-space: nowrap;
		}

		.moout-table {
			table-layout: fixed;
			width: 100%;
		}

		.moout-table tbody td {
			font-size: 13px;
			vertical-align: middle;
			white-space: nowrap;
		}

		.moout-table th,
		.moout-table td {
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.moout-placeholder {
			text-align: center;
			color: #6b7280;
		}

		.data-table th,
		.data-table td {
			text-align: center;
			vertical-align: middle;
		}

		.data-table input,
		.data-table select {
			text-align: center;
		}

		.mout-factory-wrapper {
			position: relative;
			min-width: 180px;
		}

		.mout-factory-wrapper .input-group {
			flex-wrap: nowrap;
		}

		.mout-factory-wrapper .form-control {
			min-width: 0;
		}

		.mout-factory-wrapper .btn {
			width: 32px;
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
		}

		.mout-color-col,
		.mout-material-color-col {
			max-width: 90px;
			width: 90px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.mout-producer-col {
			min-width: 200px;
			width: 200px;
			overflow: visible;
		}
	</style>

	<div class="mb-3">
		<h4 class="fw-bold mb-1">원부자재 출고 등록</h4>
		<p class="text-muted mb-0">품번/색상/생산합의코드 기준으로 출고 대상 목록을 조회하세요.</p>
	</div>

	<div class="moout-layout">
		<div class="material-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="fw-bold mb-0">검색/선택</h6>
				<small class="text-muted">품번 확인 후 색상과 생산합의코드를 선택하세요.</small>
			</div>
			<div class="material-row form-row mb-2">
				<label class="form-label fw-bold mb-0">품번</label>
				<input type="hidden" id="mout-styles-id">
				<div class="material-style-input input-group">
					<input type="text" id="mout-style-input" class="form-control" placeholder="품번을 입력하세요">
					<button type="button" class="btn btn--outline" id="mout-verify-button">품번 확인</button>
				</div>
			</div>
			<div class="material-row form-row justify-content-between">
				<div class="material-meta-item">
					<label class="form-label fw-bold mb-0">색상</label>
					<select id="mout-color-select" class="form-select material-color-select" disabled>
						<option value="">색상을 선택하세요</option>
					</select>
				</div>
				<div class="material-meta-item">
					<label class="form-label fw-bold mb-0">생산합의코드</label>
					<select id="mout-agreement-select" class="form-select material-agree-select" disabled>
						<option value="">생산합의코드를 선택하세요</option>
					</select>
				</div>
				<div class="actions ms-auto">
					<button type="button" class="btn btn--primary material-search-button"
						id="mout-search-button">조회</button>
				</div>
			</div>
			<div id="mout-search-message" class="mt-2"></div>
		</div>

		<div class="material-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<div>
					<h6 class="fw-bold mb-0">출고 대상 목록</h6>
					<small class="text-muted">실입고 누적을 초과하는 실출고는 저장이 차단됩니다.</small>
				</div>
				<div class="actions">
					<button type="button" class="btn btn--primary" id="mout-save-button">저장</button>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-bordered align-middle moout-table data-table">
					<thead class="table-light">
						<tr>
							<th>품번</th>
							<th class="mout-color-col">색상</th>
							<th>생산합의코드</th>
							<th>원부자재구분</th>
							<th>자재명칭</th>
							<th>용도</th>
							<th>자재규격</th>
							<th class="mout-material-color-col">자재색상</th>
							<th>소요량단위</th>
							<th>1매소요량</th>
							<th>자재처</th>
							<th>생산담당</th>
							<th>발주단위</th>
							<th>단가</th>
							<th>발주량</th>
							<th>입고량</th>
							<th>재고량</th>
							<th>출고량</th>
							<th class="mout-producer-col">생산처</th>
						</tr>
					</thead>
					<tbody id="mout-table-body">
						<tr>
							<td colspan="19" class="moout-placeholder">품번/색상/생산합의 조건 선택한 뒤 조회하세요.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<div class="modal fade" id="factoryModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">생산처 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<table class="table table-bordered align-middle mb-0">
						<thead class="table-light">
							<tr>
								<th>코드</th>
								<th>상호</th>
							</tr>
						</thead>
						<tbody id="factory-modal-body">
							<tr th:if="${#lists.isEmpty(factories)}">
								<td colspan="2" class="text-center text-muted">등록된 생산처가 없습니다.</td>
							</tr>
							<tr th:each="factory : ${factories}"
								th:attr="data-factory-code=${factory.code},data-factory-name=${factory.name}">
								<td th:text="${factory.code}">-</td>
								<td th:text="${factory.name}">-</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn--outline" data-bs-dismiss="modal">닫기</button>
					<button type="button" class="btn btn--primary" id="factory-select-button">선택</button>
				</div>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		document.addEventListener('DOMContentLoaded', () => {
			const styleIdInput = document.getElementById('mout-styles-id');
			const styleCodeInput = document.getElementById('mout-style-input');
			const colorSelect = document.getElementById('mout-color-select');
			const agreeSelect = document.getElementById('mout-agreement-select');
			const searchButton = document.getElementById('mout-search-button');
			const verifyButton = document.getElementById('mout-verify-button');
			const saveButton = document.getElementById('mout-save-button');
			const tableBody = document.getElementById('mout-table-body');
			const messageBox = document.getElementById('mout-search-message');
			const factoryModalElement = document.getElementById('factoryModal');
			const factoryModalBody = document.getElementById('factory-modal-body');
			const factorySelectButton = document.getElementById('factory-select-button');
			const factoryModal = factoryModalElement && window.bootstrap
				? new window.bootstrap.Modal(factoryModalElement)
				: null;
			let styleVerified = false;
			let activeFactoryRow = null;
			let selectedFactory = null;

			styleCodeInput.addEventListener('input', () => {
				styleIdInput.value = '';
				styleVerified = false;
				renderSelectOptions(colorSelect, [], '색상 선택');
				renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
				colorSelect.disabled = true;
				agreeSelect.disabled = true;
				clearMessage();
			});

			function loadSelectionOptions(styleCode) {
				fetch(`/production/material-outbound/options?styleCode=${encodeURIComponent(styleCode)}`)
					.then(res => res.json())
					.then(data => {
						renderSelectOptions(colorSelect, data.colors, '색상 선택');
						renderSelectOptions(agreeSelect, data.agreements, '생산합의코드 선택');
						colorSelect.disabled = false;
						agreeSelect.disabled = false;
					})
					.catch(() => {
						renderSelectOptions(colorSelect, [], '색상 선택');
						renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
						colorSelect.disabled = false;
						agreeSelect.disabled = false;
					});
			}

			function renderSelectOptions(selectEl, options, placeholder) {
				selectEl.innerHTML = '';
				const defaultOpt = document.createElement('option');
				defaultOpt.value = '';
				defaultOpt.textContent = placeholder;
				selectEl.appendChild(defaultOpt);
				(options || []).forEach(opt => {
					const optionEl = document.createElement('option');
					optionEl.value = opt;
					optionEl.textContent = opt;
					selectEl.appendChild(optionEl);
				});
			}

			function resetTable(message) {
				tableBody.innerHTML = `<tr><td colspan="19" class="moout-placeholder">${message}</td></tr>`;
			}

			function setMessage(type, text) {
				messageBox.innerHTML = `<div class="alert alert-${type} py-2 mb-0">${text}</div>`;
			}

			function clearMessage() {
				messageBox.innerHTML = '';
			}

			async function checkStyleExists(styleCode) {
				try {
					const res = await fetch(`/production/material-outbound/styles?keyword=${encodeURIComponent(styleCode)}`);
					if (!res.ok) {
						return true;
					}
					const list = await res.json();
					return (list || []).some(item => (item.styleCode || '').toLowerCase() === styleCode.toLowerCase());
				} catch (e) {
					return true;
				}
			}

			async function verifyStyleCode() {
				clearMessage();
				const styleCode = styleCodeInput.value.trim();
				if (!styleCode) {
					setMessage('danger', '품번을 입력하세요.');
					styleVerified = false;
					return;
				}
				const exists = await checkStyleExists(styleCode);
				if (!exists) {
					setMessage('danger', '존재하지 않는 품번입니다.');
					styleVerified = false;
					renderSelectOptions(colorSelect, [], '색상 선택');
					renderSelectOptions(agreeSelect, [], '생산합의코드 선택');
					colorSelect.disabled = true;
					agreeSelect.disabled = true;
					return;
				}
				styleVerified = true;
				setMessage('success', '품번이 확인되었습니다.');
				loadSelectionOptions(styleCode);
			}

			searchButton.addEventListener('click', async () => {
				clearMessage();
				const styleCode = styleCodeInput.value.trim();
				if (!styleVerified) {
					setMessage('danger', '품번 확인 후 조회하세요.');
					resetTable('품번을 확인한 뒤 조회하세요.');
					return;
				}
				if (!styleCode || !colorSelect.value || !agreeSelect.value) {
					setMessage('danger', '품번/색상/생산합의코드를 선택하세요.');
					resetTable('품번/색상/생산합의 조건을 선택한 뒤 조회하세요.');
					return;
				}
				await loadMaterials(styleCode);
			});

			async function loadMaterials(styleCode) {
				const url = `/production/material-outbound/list?styleCode=${encodeURIComponent(styleCode)}&prdAgreeCode=${encodeURIComponent(agreeSelect.value)}&colorCode=${encodeURIComponent(colorSelect.value)}`;
				try {
					const res = await fetch(url);
					const payload = await res.json();
					if (!res.ok) {
						const errorMessage = payload?.message || '조회 중 오류가 발생했습니다.';
						throw new Error(errorMessage);
					}
					const list = payload;
					renderTable(list);
					if (list && list.length > 0) {
						setMessage('success', `총 ${list.length}건 조회되었습니다.`);
						return;
					}
					if (styleCode) {
						const exists = await checkStyleExists(styleCode);
						if (!exists) {
							setMessage('danger', '존재하지 않는 품번입니다.');
							return;
						}
					}
					setMessage('warning', '조회된 데이터가 없습니다.');
				} catch (e) {
					const rawMessage = e?.message;
					const message = rawMessage && rawMessage.includes('원인:')
						? rawMessage
						: `조회 중 오류가 발생했습니다. (원인: ${rawMessage || '알 수 없는 오류'})`;
					renderTable([]);
					setMessage('danger', message);
				}
			}

			function renderTable(list) {
				tableBody.innerHTML = '';
				if (!list || list.length === 0) {
					resetTable('조회된 데이터가 없습니다.');
					return;
				}
				list.forEach(item => {
					const stock = safeNumber(item.inventoryQuantity ?? item.inventory_qty ?? item.inboundQuantity);
					const available = Math.max(stock, 0);
					const requiredQty = formatQuantity(item.requiredQuantity ?? item.orderQuantity);
					const row = document.createElement('tr');
					row.dataset.mOrderId = item.mOrderId || '';
					row.dataset.orderUom = item.orderUom || '';
					row.dataset.unitPrice = item.unitPrice || '';
					row.dataset.available = available;
					const inventoryQty = formatQuantity(stock);
					row.innerHTML = `
							<td>${item.styleCode || '-'}</td>
							<td class="mout-color-col">${item.colorCode || '-'}</td>
							<td>${item.agreementMonth || item.prdAgreeCode || '-'}</td>
							<td>${item.category || '-'}</td>
							<td>${item.materialName || '-'}</td>
							<td>${item.materialUsage || '-'}</td>
							<td>${item.spec || '-'}</td>
							<td class="mout-material-color-col">${item.materialColor || '-'}</td>
							<td>${item.uom || '-'}</td>
							<td>${formatQuantity(item.qtyPerPiece)}</td>
							<td>${item.supplierName || item.supplierCode || '-'}</td>
							<td>${item.productionManager || '-'}</td>
							<td>${item.orderUom || '-'}</td>
							<td>${formatPrice(item.unitPrice)}</td>
							<td>${requiredQty}</td>
							<td>${formatQuantity(item.inboundQuantity)}</td>
							<td><span class="text-muted small">${inventoryQty}</span></td>
							<td>
								<div class="d-flex flex-column gap-1">
									<span class="text-muted small">${formatQuantity(item.outboundQuantity)}</span>
									<input type="number" class="form-control form-control-sm mout-issued-input" min="0" step="0.001" value="0">
								</div>
							</td>
							<td class="mout-producer-col">${renderFactoryInput()}</td>
						`;
					const issuedInput = row.querySelector('.mout-issued-input');
					issuedInput.addEventListener('input', () => {
						const val = parseFloat(issuedInput.value || '0');
						if (!isNaN(val) && val > available) {
							alert('출고 가능 수량을 초과했습니다.');
							issuedInput.value = available > 0 ? available : 0;
						}
					});
					attachFactorySearch(row);
					tableBody.appendChild(row);
				});
			}

			function renderFactoryInput() {
				return `
								<div class="mout-factory-wrapper">
									<div class="input-group input-group-sm">
										<input type="text" class="form-control mout-factory-input" placeholder="생산처 코드 검색">
										<button type="button" class="btn btn--outline mout-factory-search" title="생산처 검색">
											<i class="bi bi-search"></i>
										</button>
									</div>
									<span class="text-muted small mout-factory-name"></span>
								</div>
							`;
			}

			function attachFactorySearch(row) {
				const wrapper = row.querySelector('.mout-factory-wrapper');
				const input = row.querySelector('.mout-factory-input');
				const button = row.querySelector('.mout-factory-search');
				const nameLabel = row.querySelector('.mout-factory-name');

				if (!wrapper || !input || !button) {
					return;
				}
				button.addEventListener('click', (event) => {
					event.preventDefault();
					event.stopPropagation();
					activeFactoryRow = row;
					selectedFactory = null;
					clearFactorySelection();
					if (factoryModal) {
						factoryModal.show();
					}
				});
			}

			function clearFactorySelection() {
				if (!factoryModalBody) {
					return;
				}
				factoryModalBody.querySelectorAll('tr').forEach(row => row.classList.remove('table-active'));
			}

			function applyFactorySelection() {
				if (!activeFactoryRow || !selectedFactory) {
					return;
				}
				const input = activeFactoryRow.querySelector('.mout-factory-input');
				const nameLabel = activeFactoryRow.querySelector('.mout-factory-name');
				if (input) {
					input.value = selectedFactory.code;
				}
				if (nameLabel) {
					nameLabel.textContent = selectedFactory.name || '';
				}
			}

			if (factoryModalBody) {
				factoryModalBody.addEventListener('click', (event) => {
					const row = event.target.closest('tr[data-factory-code]');
					if (!row) {
						return;
					}
					clearFactorySelection();
					row.classList.add('table-active');
					selectedFactory = {
						code: row.dataset.factoryCode || '',
						name: row.dataset.factoryName || ''
					};
				});

				factoryModalBody.addEventListener('dblclick', (event) => {
					const row = event.target.closest('tr[data-factory-code]');
					if (!row) {
						return;
					}
					clearFactorySelection();
					row.classList.add('table-active');
					selectedFactory = {
						code: row.dataset.factoryCode || '',
						name: row.dataset.factoryName || ''
					};
					applyFactorySelection();
					if (factoryModal) {
						factoryModal.hide();
					}
				});
			}

			if (factorySelectButton) {
				factorySelectButton.addEventListener('click', () => {
					applyFactorySelection();
					if (factoryModal) {
						factoryModal.hide();
					}
				});
			}


			saveButton.addEventListener('click', () => {
				const rows = Array.from(tableBody.querySelectorAll('tr[data-m-order-id]'));
				const items = [];
				let hasValidationError = false;

				rows.forEach(row => {
					const issued = parseFloat(row.querySelector('.mout-issued-input')?.value || '0');
					if (issued > 0) {
						const available = parseFloat(row.dataset.available || '0');
						if (issued > available) {
							hasValidationError = true;
							return;
						}
						const factoryInput = row.querySelector('.mout-factory-input');
						const factoryCode = factoryInput?.value || '';
						if (!factoryCode) {
							hasValidationError = true;
							return;
						}
						items.push({
							mOrderId: row.dataset.mOrderId || null,
							issuedOutQuantity: isNaN(issued) ? 0 : issued,
							orderUom: row.dataset.orderUom || null,
							unitPrice: row.dataset.unitPrice ? Number(row.dataset.unitPrice) : null,
							factoryCode
						});
					}
				});

				if (hasValidationError) {
					alert('출고량 또는 생산처를 확인하세요.');
					return;
				}
				if (items.length === 0) {
					alert('출고량을 입력하세요.');
					return;
				}

				const payload = {
					stylesId: styleIdInput.value,
					styleCode: styleCodeInput.value,
					prdAgreeCode: agreeSelect.value,
					colorCode: colorSelect.value,
					items
				};

				fetch('/production/material-outbound/save', {
					method: 'POST',
					headers: {'Content-Type': 'application/json'},
					body: JSON.stringify(payload)
				})
					.then(async res => {
						const data = await res.json().catch(() => ({}));
						if (!res.ok) {
							const errorMessage = data?.message || '출고 등록에 실패했습니다.';
							throw new Error(errorMessage);
						}
						return data;
					})
					.then(data => {
						if (data.success) {
							alert(data.message || '출고가 등록되었습니다.');
							loadMaterials(styleCodeInput.value.trim());
						} else {
							alert(data.message || '출고 등록에 실패했습니다.');
						}
					})
					.catch((e) => {
						const rawMessage = e?.message;
						const message = rawMessage && rawMessage.includes('원인:')
							? rawMessage
							: `출고 등록에 실패했습니다. (원인: ${rawMessage || '알 수 없는 오류'})`;
						alert(message);
					});
			});

			function formatQuantity(value) {
				const num = Number(value);
				const safe = isNaN(num) ? 0 : num;
				return safe.toLocaleString(undefined, {minimumFractionDigits: 3, maximumFractionDigits: 3});
			}

			function formatPrice(value) {
				const num = Number(value);
				const safe = isNaN(num) ? 0 : num;
				return safe.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
			}

			function safeNumber(value) {
				const num = Number(value);
				return isNaN(num) ? 0 : num;
			}

			verifyButton.addEventListener('click', verifyStyleCode);
		});
		/*]]>*/
	</script>
</div>
