<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>공통 코드 관리</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
	<div class="container py-4">
		<div class="d-flex align-items-center justify-content-between mb-4">
			<div>
				<h2 class="mb-0 fw-bold">공통 코드 관리</h2>
				<div class="text-muted small">분류/코드별 CRUD (소프트 삭제)</div>
			</div>
		</div>
		<div th:replace="~{::message(${message})}"></div>
		<div class="row g-4">
			<div class="col-lg-4" th:replace="~{::codeForm(${form})}"></div>
			<div class="col-lg-8" th:replace="~{::codeTable(${codes})}"></div>
		</div>
	</div>
	<div th:fragment="message(message)">
		<div th:if="${message}" class="alert alert-info d-flex align-items-center" role="alert"> <i
				class="bi bi-info-circle me-2"></i> <span th:text="${message}">message</span> </div>
	</div>
	<div th:fragment="codeForm(form)">
		<div class="card ui-card">
			<div class="card-body ui-card-body">
				<h5 class="card-title fw-bold mb-3">코드 입력</h5>
				<form th:action="@{/codes}" method="post" id="codeForm" th:attr="data-create-action=@{/codes}">
					<div class="mb-3"> <label class="form-label fw-semibold">분류 코드</label> <input type="text"
							class="form-control" name="codeType" id="codeType" placeholder="예) COLOR" required> </div>
					<div class="mb-3"> <label class="form-label fw-semibold">코드</label> <input type="text"
							class="form-control" name="code" id="code" placeholder="예) RED" required> </div>
					<div class="mb-3"> <label class="form-label fw-semibold">코드명</label> <input type="text"
							class="form-control" name="name" id="name" placeholder="예) 빨강" required> </div>
					<div class="mb-3"> <label class="form-label fw-semibold">정렬순서</label> <input type="number"
							class="form-control" name="sortOrder" id="sortOrder" value="0" min="0"> </div>
					<div class="mb-3"> <label class="form-label fw-semibold">설명</label> <textarea class="form-control"
							name="description" id="description" rows="2" placeholder="메모를 입력하세요"></textarea> </div>
					<div class="d-flex gap-2"> <button type="submit" class="btn btn--primary flex-grow-1"
							id="submitBtn">
							<i class="bi bi-plus-lg me-1"></i><span id="submitLabel">추가</span> </button> <button
							type="button" class="btn btn--outline" id="resetBtn"> <i
								class="bi bi-arrow-counterclockwise me-1"></i>새 입력
							<div th:fragment="codeTable(codes)">
								<div class="card ui-card">
									<div class="card-body ui-card-body">
										<div class="d-flex align-items-center justify-content-between mb-3">
											<h5 class="card-title fw-bold mb-0">코드 목록</h5> <span
												class="badge text-bg-light"
												th:text="${#lists.size(codes)} + '건'">0건</span>
										</div>
										<div class="table-responsive">
											<table class="table table-hover align-middle mb-0 data-table">
												<thead class="table-light">
													<tr>
														<th style="width: 12%" class="t-left">분류</th>
														<th style="width: 12%" class="t-left">코드</th>
														<th style="width: 20%" class="t-left">코드명</th>
														<th style="width: 10%">정렬</th>
														<th class="t-left">설명</th>
														<th style="width: 120px;" class="text-center">관리</th>
													</tr>
												</thead>
												<tbody>
													<tr th:if="${#lists.isEmpty(codes)}">
														<td colspan="6" class="text-center text-muted">등록된 코드가 없습니다.
														</td>
													</tr>
													<tr th:each="code : ${codes}">
														<td class="t-left" th:text="${code.codeType}">COLOR</td>
														<td class="t-left" th:text="${code.code}">RED</td>
														<td class="t-left" th:text="${code.name}">빨강</td>
														<td th:text="${code.sortOrder}">0</td>
														<td class="t-left" th:text="${code.description}">설명</td>
														<td class="text-center">
															<div class="btn-group btn-group-sm" role="group"> <button
																	type="button" class="btn btn--outline"
																	th:attr="data-type=${code.id.codeType}, data-code=${code.id.code}, data-name=${code.name}, data-sort=${code.sortOrder}, data-desc=${code.description}"
																	onclick="fillForm(this)"> <i
																		class="bi bi-pencil"></i> </button>
																<form
																	th:action="@{'/codes/' + ${code.id.codeType} + '/' + ${code.id.code} + '/delete'}"
																	method="post" class="d-inline"> <button
																		type="submit" class="btn btn--outline"
																		onclick="return confirm('삭제하시겠습니까?');"> <i
																			class="bi bi-trash"></i> </button> </form>
															</div>
														</td>
													</tr>
												</tbody>
											</table>
										</div>
									</div>
								</div>
							</div>
							<script>
								const formEl = document.getElementById('codeForm');
								const submitLabel = document.getElementById('submitLabel');
								const submitBtn = document.getElementById('submitBtn');
								const resetBtn = document.getElementById('resetBtn');
								const createAction = formEl?.dataset.createAction;
								function resetForm() {
									if (!formEl) return;
									formEl.reset();
									formEl.action = createAction || '/codes';
									submitLabel.textContent = '추가';
									submitBtn.className = 'btn btn--primary flex-grow-1';
								}

								function fillForm(button) {
									if (!formEl || !button) return;
									formEl.action = `/codes/${button.dataset.type}/${button.dataset.code}/update`;
									document.getElementById('codeType').value = button.dataset.type || '';
									document.getElementById('code').value = button.dataset.code || '';
									document.getElementById('name').value = button.dataset.name || '';
									document.getElementById('sortOrder').value = button.dataset.sort || 0;
									document.getElementById('description').value = button.dataset.desc || '';
									submitLabel.textContent = '수정';
									submitBtn.className = 'btn btn--primary flex-grow-1';
								}

								resetBtn?.addEventListener('click', resetForm);
							</script>
</body>

</html>
