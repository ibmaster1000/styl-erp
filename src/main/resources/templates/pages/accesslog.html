<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<div class="mb-3">
		<h4 class="fw-bold mb-1">접속 로그</h4>
		<p class="text-muted mb-0">시스템 접속 이력 조회</p>
	</div>

	<div class="kpi-cards">
		<div class="kpi-card">
			<div class="kpi-label">진행중 작업지시</div>
			<div class="kpi-value" th:text="${kpi.workOrdersInProgress}">0</div>
		</div>
		<div class="kpi-card">
			<div class="kpi-label">금일 입고</div>
			<div class="kpi-value" th:text="${kpi.todayReceipts}">0</div>
		</div>
		<div class="kpi-card">
			<div class="kpi-label">금일 출고</div>
			<div class="kpi-value" th:text="${kpi.todayShipments}">0</div>
		</div>
	</div>

	<form class="card shadow-sm mb-3">
		<div class="card-body row g-3 align-items-end">
			<div class="col-md-4">
				<label class="form-label fw-semibold">사용자</label>
				<input type="text" class="form-control" placeholder="이름 또는 아이디">
			</div>
			<div class="col-md-4">
				<label class="form-label fw-semibold">접속일</label>
				<input type="date" class="form-control">
			</div>
			<div class="col-md-3">
				<label class="form-label fw-semibold">결과</label>
				<select class="form-select">
					<option selected>전체</option>
					<option>성공</option>
					<option>실패</option>
				</select>
			</div>
			<div class="col-md-1 d-grid">
				<button type="button" class="btn btn-dark">검색</button>
			</div>
		</div>
	</form>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="mb-0 fw-bold">접속 로그 목록</h6>
				<span class="text-muted small" th:text="'총 ' + ${#lists.size(list)} + '건'">총 0건</span>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th>시간</th>
							<th>사용자</th>
							<th>IP</th>
							<th>브라우저</th>
							<th>결과</th>
							<th>메시지</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(list)}">
							<td colspan="6" class="text-center text-muted">조회된 데이터가 없습니다.</td>
						</tr>
						<tr th:each="row : ${list}">
							<td th:text="${row['time']}">2024-01-01 12:00</td>
							<td th:text="${row['user']}">admin</td>
							<td th:text="${row['ip']}">127.0.0.1</td>
							<td th:text="${row['agent']}">Chrome</td>
							<td th:text="${row['result']}">성공</td>
							<td th:text="${row['message']}">로그인 성공</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="pt-3 text-center text-muted small">페이징 영역</div>
		</div>
	</div>
	<section class="panel mt-3">
		<h4 class="h6 fw-bold mb-2">준비중</h4>
		<div class="text-muted small">상세 기능은 추후 추가됩니다.</div>
	</section>
</div>
