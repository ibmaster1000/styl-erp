<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<style>
		.ms-layout {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.ms-table thead th {
			font-size: 13px;
			font-weight: 800;
			background: #f9fafb;
			white-space: nowrap;
		}

		.ms-table tbody td {
			font-size: 13px;
			vertical-align: middle;
			white-space: nowrap;
		}

		.ms-modal-backdrop {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(15, 23, 42, 0.45);
			padding: 20px;
			z-index: 1050;
		}

		.ms-modal-backdrop.active {
			display: flex;
		}

		.ms-modal {
			background: #ffffff;
			border-radius: 12px;
			border: 1px solid #e5e7eb;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
			padding: 16px;
			max-width: 520px;
			width: 100%;
		}

		.ms-modal .table-responsive {
			max-height: 320px;
		}
	</style>

	<div class="mb-3">
		<h4 class="fw-bold mb-1">원부자재 사양서 등록</h4>
		<p class="text-muted mb-0">품번 기준 색상×사이즈 정보를 확인하고 자재 사양서를 관리하세요.</p>
	</div>

	<div class="ms-layout">
		<div
			th:replace="~{fragments/material-top-search-with-rule :: materialTopSearchWithRule('ms', '색상 × 사이즈 요약', '선택된 품번의 스타일 규칙을 표시합니다.')}">
		</div>

		<div class="material-panel">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="mb-0 fw-bold">원부자재 사양서 목록</h6>
				<span class="text-muted small" th:text="'총 ' + ${#lists.size(list)} + '건'">총 0건</span>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0 ms-table data-table">
					<thead class="table-light">
						<tr>
							<th>구분</th>
							<th class="t-left">자재명칭</th>
							<th class="t-left">용도</th>
							<th class="t-left">자재규격</th>
							<th class="t-left">자재색상</th>
							<th>소요량 단위</th>
							<th>1매 소요량</th>
							<th class="t-left">자재코드</th>
							<th class="t-left">자재처</th>
							<th>LOSS율</th>
							<th>발주단위</th>
							<th>단가</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(list)}">
							<td colspan="12" class="text-center text-muted">등록된 자재 사양서가 없습니다.</td>
						</tr>
						<tr th:each="item : ${list}">
							<td th:text="${item.category}">원자재</td>
							<td class="t-left" th:text="${item.materialName}">FABRIC A</td>
							<td class="t-left" th:text="${item.materialUsage}">상의</td>
							<td class="t-left" th:text="${item.spec}">50x70</td>
							<td class="t-left" th:text="${item.materialColor}">BK</td>
							<td th:text="${item.uom}">YD</td>
							<td
								th:text="${item.qtyPerPiece} != null ? #numbers.formatDecimal(item.qtyPerPiece, 1, 'COMMA', 2, 'POINT') : '-'">
								0.50</td>
							<td class="t-left" th:text="${item.materialCode}">MP25001-1-WH003</td>
							<td class="t-left" th:text="${item.supplierCode}">SUP-01</td>
							<td th:text="${item.lossRate} != null ? item.lossRate + '%' : '-'">2%</td>
							<td th:text="${item.orderUom}">EA</td>
							<td
								th:text="${item.unitPrice} != null ? #numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT') : '-'">
								5,000</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<div class="ms-modal-backdrop" id="style-search-modal">
		<div class="ms-modal">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="mb-0 fw-bold">품번 검색</h6>
				<button type="button" class="btn-close" aria-label="닫기" id="ms-style-close"></button>
			</div>
			<div class="table-responsive">
				<table class="table data-table align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th class="t-left">품번</th>
							<th class="t-left">품목</th>
							<th class="text-end">선택</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(styles)}">
							<td colspan="3" class="text-center text-muted">등록된 품번이 없습니다.</td>
						</tr>
						<tr th:each="style : ${styles}">
							<td class="t-left" th:text="${style.styleCode}">ST-0001</td>
							<td class="t-left" th:text="${style.item}">상의</td>
							<td class="text-end">
								<button type="button" class="btn btn--outline" data-style-pick
									th:attr="data-style-code=${style.styleCode},data-style-id=${style.stylesId}">선택</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		const msStyles = /*[[${styles}]]*/[];
		const msStyleRules = /*[[${styleRules}]]*/ {};
		const styleInput = document.getElementById('ms-style-input');
		const styleIdInput = document.getElementById('ms-styles-id');
		const colorSelect = document.getElementById('ms-color-select');
		const agreementSelect = document.getElementById('ms-agreement-select');
		const styleChip = document.getElementById('ms-style-chip');
		const modal = document.getElementById('style-search-modal');
		const searchButton = document.getElementById('ms-search-button');
		const ruleHead = document.getElementById('ms-rule-head');
		const ruleBody = document.getElementById('ms-rule-body');
		searchButton.disabled = true;

		const closeModal = () => modal.classList.remove('active');

		const renderColorSizeTable = (styleCode) => {
			ruleHead.innerHTML = '';
			ruleBody.innerHTML = '';

			const rules = msStyleRules?.[styleCode];
			if (!rules || Object.keys(rules).length === 0) {
				const emptyHeadRow = document.createElement('tr');
				['색상', '-'].forEach((label) => {
					const th = document.createElement('th');
					if (label === '색상') {
						th.classList.add('t-left');
					}
					th.textContent = label;
					emptyHeadRow.appendChild(th);
				});
				ruleHead.appendChild(emptyHeadRow);

				const emptyRow = document.createElement('tr');
				const td = document.createElement('td');
				td.colSpan = 2;
				td.className = 'text-center text-muted';
				td.textContent = '선택된 품번의 스타일 규칙이 없습니다.';
				emptyRow.appendChild(td);
				ruleBody.appendChild(emptyRow);
				return;
			}

			const sizeOrder = [];
			Object.values(rules).forEach((sizes) => {
				if (Array.isArray(sizes)) {
					sizes.forEach((s) => {
						if (!sizeOrder.includes(s)) sizeOrder.push(s);
					});
				}
			});

			const headRow = document.createElement('tr');
			const colorHead = document.createElement('th');
			colorHead.textContent = '색상';
			colorHead.classList.add('t-left');
			headRow.appendChild(colorHead);
			sizeOrder.forEach((size) => {
				const th = document.createElement('th');
				th.textContent = size;
				headRow.appendChild(th);
			});
			ruleHead.appendChild(headRow);

			Object.entries(rules).forEach(([color, sizes]) => {
				const tr = document.createElement('tr');
				const colorCell = document.createElement('td');
				colorCell.classList.add('t-left');
				tr.appendChild(colorCell);
				sizeOrder.forEach((size) => {
					const td = document.createElement('td');
					td.textContent = '-';
					tr.appendChild(td);
				});
				ruleBody.appendChild(tr);
			});
		};

		const populateSelectors = (styleCode) => {
			const rules = msStyleRules?.[styleCode];
			colorSelect.innerHTML = '<option value=\"\">색상을 선택하세요</option>';
			agreementSelect.innerHTML = '<option value=\"\">생산합의 코드를 선택하세요</option>';
			const hasRules = rules && Object.keys(rules).length > 0;
			colorSelect.disabled = !hasRules;
			agreementSelect.disabled = !hasRules;
			searchButton.disabled = !styleCode;
			if (hasRules) {
				Object.keys(rules).forEach((color) => {
					const option = document.createElement('option');
					option.value = color;
					option.textContent = color;
					colorSelect.appendChild(option);
				});
			}
		};

		const applyStyleSelection = (styleCode, stylesId) => {
			if (!styleCode) return;
			styleInput.value = styleCode;
			styleIdInput.value = stylesId || '';
			styleChip.textContent = styleCode;
			populateSelectors(styleCode);
			renderColorSizeTable(styleCode);
			closeModal();
		};

		document.getElementById('ms-style-search').addEventListener('click', () => {
			modal.classList.add('active');
		});

		document.getElementById('ms-style-close').addEventListener('click', closeModal);
		modal.addEventListener('click', (e) => {
			if (e.target === modal) closeModal();
		});

		document.querySelectorAll('[data-style-pick]').forEach((button) => {
			button.addEventListener('click', (e) => {
				const selectedCode = e.currentTarget.dataset.styleCode;
				const selectedId = e.currentTarget.dataset.styleId;
				applyStyleSelection(selectedCode, selectedId);
			});
		});

		searchButton.addEventListener('click', () => {
			if (!styleInput.value) {
				alert('품번을 먼저 선택하세요.');
			}
		});
		/*]]>*/
	</script>
</div>
