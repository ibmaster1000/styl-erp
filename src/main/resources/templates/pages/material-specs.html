<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<style>
		.ms-layout {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.ms-card {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 8px;
			padding: 20px;
			margin-bottom: 16px;
		}

		.ms-top-layout {
			display: flex;
			gap: 16px;
			align-items: stretch;
			min-height: 240px;
		}

		.ms-search-controls {
			flex: 1 1 55%;
			display: grid;
			grid-template-rows: auto auto;
			gap: 14px;
		}

		.ms-row {
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		.ms-row .form-label {
			margin-bottom: 0;
			white-space: nowrap;
		}

		.ms-style-input {
			flex: 1 1 260px;
			max-width: 340px;
			min-width: 240px;
		}

		.ms-meta-item {
			display: flex;
			align-items: center;
			gap: 8px;
			flex: 1 1 auto;
			min-width: 200px;
		}

		.ms-meta-item .form-control {
			min-width: 140px;
		}

		.ms-meta-item .form-select {
			min-width: 140px;
		}

		.ms-color-input {
			min-width: 120px;
		}

		.ms-agree-input {
			flex: 1 1 240px;
		}

		.ms-search-button {
			width: 140px;
			align-self: stretch;
			min-height: 38px;
		}

		.ms-status {
			font-size: 13px;
		}

		.ms-rule-card {
			flex: 1 1 45%;
			display: flex;
			flex-direction: column;
			gap: 12px;
			min-width: 320px;
		}

		.ms-rule-card .table-responsive {
			max-height: 260px;
		}

		.ms-rule-card table th {
			font-size: 13px;
			font-weight: 800;
			background: #f9fafb;
			text-align: center;
			white-space: nowrap;
		}

		.ms-rule-card table td {
			font-size: 13px;
			text-align: center;
			white-space: nowrap;
		}

		.ms-table thead th {
			font-size: 13px;
			font-weight: 800;
			text-align: center;
			background: #f9fafb;
			white-space: nowrap;
		}

		.ms-table tbody td {
			font-size: 13px;
			vertical-align: middle;
			text-align: center;
			white-space: nowrap;
		}

		.ms-table tbody td.t-left {
			text-align: left;
		}

		.ms-table .form-control,
		.ms-table .form-select {
			font-size: 13px;
			padding: 4px 6px;
			height: 32px;
		}

		.ms-table .input-group .btn {
			padding: 4px 8px;
		}

		.ms-table .ms-readonly {
			background: #f3f4f6;
		}

		.ms-modal-row {
			cursor: pointer;
		}

		.ms-modal-row.active {
			background: rgba(107, 114, 128, 0.15);
		}

		@media (max-width: 992px) {
			.ms-top-layout {
				flex-direction: column;
			}
		}
	</style>

	<div class="ms-card">
		<h4 class="fw-bold mb-1">원부자재 사양서 등록</h4>
		<p class="text-muted mb-0">선택된 품번/색상/생산합의 기준으로 원부자재 사양서를 등록합니다.</p>
	</div>

	<div class="ms-layout">
		<div class="ms-top-layout">
			<div class="material-panel ms-search-controls ms-card">
				<div class="ms-row form-row">
					<label class="form-label fw-bold mb-0">품번</label>
					<div class="input-group ms-style-input">
						<input type="text" class="form-control" id="ms-style-input" placeholder="품번을 입력하세요">
						<button class="btn btn--outline" type="button" id="ms-style-verify">확인</button>
					</div>
					<span class="ms-status text-muted" id="ms-style-status"></span>
				</div>
				<div class="ms-row form-row">
					<div class="ms-meta-item">
						<label class="form-label fw-bold mb-0">색상</label>
						<select class="form-select ms-color-input" id="ms-color-input" disabled>
							<option value="">색상 선택</option>
						</select>
					</div>
					<div class="ms-meta-item ms-agree-input">
						<label class="form-label fw-bold mb-0">생산합의코드</label>
						<select class="form-select" id="ms-agreement-input" disabled>
							<option value="">생산합의코드 선택</option>
						</select>
					</div>
					<div class="actions">
						<button class="btn btn--primary ms-search-button" type="button" id="ms-search-button" disabled>조회</button>
					</div>
				</div>
			</div>

			<div class="material-panel ms-rule-card ms-card">
				<div class="d-flex justify-content-between align-items-center">
					<div>
						<div class="fw-bold">색상 × 사이즈 규칙</div>
						<div class="text-muted small">생산합의 수량이 함께 표시됩니다.</div>
					</div>
					<span class="badge text-bg-light" id="ms-style-chip">-</span>
				</div>
				<div class="table-responsive">
					<table class="table data-table mb-0" id="colorSizeMatrix">
						<thead id="ms-rule-head">
							<tr>
								<th class="t-left">색상</th>
								<th class="text-muted">-</th>
							</tr>
						</thead>
						<tbody id="ms-rule-body">
							<tr>
								<td colspan="2" class="text-center text-muted">품번을 확인하세요.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div class="material-panel ms-card">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<div>
					<h6 class="mb-0 fw-bold">원부자재 사양서 목록</h6>
					<small class="text-muted" id="ms-context-summary">조회 전에는 저장할 수 없습니다.</small>
				</div>
				<div class="d-flex align-items-center gap-2">
					<button type="button" class="btn btn--outline btn-sm" id="ms-add-row" disabled>행 추가</button>
					<button type="button" class="btn btn--primary btn-sm" id="ms-save-button" disabled>저장</button>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table table-bordered align-middle mb-0 ms-table data-table" id="ms-spec-table">
					<thead class="table-light">
						<tr>
							<th>구분</th>
							<th>자재명칭</th>
							<th>용도</th>
							<th>자재규격</th>
							<th>자재색상</th>
							<th>소요량단위</th>
							<th>1매 소량</th>
							<th>자재코드</th>
							<th>자재처</th>
							<th>LOSS율</th>
							<th>발주단위</th>
							<th>단가</th>
							<th>비고</th>
							<th>삭제</th>
						</tr>
					</thead>
					<tbody id="ms-spec-body">
						<tr>
							<td colspan="14" class="text-center text-muted">조회 후 원부자재 사양서가 표시됩니다.</td>
						</tr>
					</tbody>
				</table>
			</div>
			<nav class="mt-3">
				<ul class="pagination pagination-sm justify-content-center mb-0" id="ms-pagination"></ul>
			</nav>
		</div>
	</div>

	<div class="modal fade" id="msColorModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title fw-bold">색상 선택</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="input-group mb-3">
						<input type="text" class="form-control" id="msColorKeyword" placeholder="색상 코드/명 검색">
						<button class="btn btn--primary" type="button" id="msColorSearchBtn">검색</button>
					</div>
					<div class="table-responsive">
						<table class="table table-hover align-middle data-table">
							<thead class="table-light">
								<tr>
									<th class="t-left">코드</th>
									<th class="t-left">코드명</th>
								</tr>
							</thead>
							<tbody id="msColorResults">
								<tr>
									<td colspan="2" class="text-center text-muted">검색어를 입력하세요.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn--outline" data-bs-dismiss="modal">닫기</button>
					<button type="button" class="btn btn--primary" id="msColorSelectBtn">선택</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="msSupplierModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title fw-bold">자재처 선택</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="input-group mb-3">
						<input type="text" class="form-control" id="msSupplierKeyword" placeholder="자재처 코드/명 검색">
						<button class="btn btn--primary" type="button" id="msSupplierSearchBtn">검색</button>
					</div>
					<div class="table-responsive">
						<table class="table table-hover align-middle data-table">
							<thead class="table-light">
								<tr>
									<th class="t-left">코드</th>
									<th class="t-left">회사상호</th>
									<th class="t-left">비고</th>
								</tr>
							</thead>
							<tbody id="msSupplierResults">
								<tr>
									<td colspan="3" class="text-center text-muted">검색어를 입력하세요.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn--outline" data-bs-dismiss="modal">닫기</button>
					<button type="button" class="btn btn--primary" id="msSupplierSelectBtn">선택</button>
				</div>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		const styleInput = document.getElementById('ms-style-input');
		const colorInput = document.getElementById('ms-color-input');
		const agreementInput = document.getElementById('ms-agreement-input');
		const verifyButton = document.getElementById('ms-style-verify');
		const statusMessage = document.getElementById('ms-style-status');
		const styleChip = document.getElementById('ms-style-chip');
		const searchButton = document.getElementById('ms-search-button');
		const addRowButton = document.getElementById('ms-add-row');
		const saveButton = document.getElementById('ms-save-button');
		const ruleHead = document.getElementById('ms-rule-head');
		const ruleBody = document.getElementById('ms-rule-body');
		const specBody = document.getElementById('ms-spec-body');
		const pagination = document.getElementById('ms-pagination');
		const contextSummary = document.getElementById('ms-context-summary');

		const createModal = (element, label) => {
			if (window.bootstrap?.Modal) {
				return new window.bootstrap.Modal(element);
			}
			console.warn(`${label} 모달을 초기화할 수 없습니다. Bootstrap JS가 필요합니다.`);
			return {
				show: () => {},
				hide: () => {}
			};
		};

		const colorModal = createModal(document.getElementById('msColorModal'), '색상');
		const supplierModal = createModal(document.getElementById('msSupplierModal'), '자재처');

		let materials = [];
		let deletedIds = new Set();
		let currentPage = 1;
		const pageSize = 15;
		let contextLoaded = false;
		let colorTargetInput = null;
		let supplierTargetInput = null;
		let selectedColorCode = null;
		let selectedSupplierCode = null;
		let styleVerified = false;

		const resetContextState = ({ resetMatrix } = {}) => {
			contextLoaded = false;
			addRowButton.disabled = true;
			saveButton.disabled = true;
			contextSummary.textContent = '조회 전에는 저장할 수 없습니다.';
			styleChip.textContent = '-';
			materials = [];
			deletedIds = new Set();
			currentPage = 1;
			renderMaterials();
			if (resetMatrix) {
				renderMatrixStatus('품번을 확인하세요.');
			}
		};

		const updateSelectOptions = (select, options, placeholder) => {
			select.innerHTML = '';
			const defaultOption = document.createElement('option');
			defaultOption.value = '';
			defaultOption.textContent = placeholder;
			select.appendChild(defaultOption);
			options.forEach((optionValue) => {
				const option = document.createElement('option');
				option.value = optionValue;
				option.textContent = optionValue;
				select.appendChild(option);
			});
		};

		const updateSearchButtonState = () => {
			searchButton.disabled = !(styleVerified && colorInput.value && agreementInput.value);
		};

		const clearStatusMessage = () => {
			statusMessage.textContent = '';
			statusMessage.classList.remove('text-success', 'text-danger');
			statusMessage.classList.add('text-muted');
		};

		const setStatusMessage = (message, isSuccess) => {
			statusMessage.textContent = message;
			statusMessage.classList.remove('text-muted', 'text-success', 'text-danger');
			statusMessage.classList.add(isSuccess ? 'text-success' : 'text-danger');
		};

		const resetOptionState = () => {
			styleVerified = false;
			colorInput.disabled = true;
			agreementInput.disabled = true;
			updateSelectOptions(colorInput, [], '색상 선택');
			updateSelectOptions(agreementInput, [], '생산합의코드 선택');
			updateSearchButtonState();
		};

		const updateSummary = () => {
			const styleCode = styleInput.value.trim();
			const colorCode = colorInput.value.trim();
			const agreeCode = agreementInput.value.trim();
			if (contextLoaded) {
				contextSummary.textContent = `품번 ${styleCode} / 색상 ${colorCode} / 생산합의 ${agreeCode}`;
			}
		};

		const renderMatrixStatus = (message) => {
			ruleHead.innerHTML = '';
			ruleBody.innerHTML = '';
			const headRow = document.createElement('tr');
			headRow.innerHTML = '<th class="t-left">색상</th><th class="text-muted">-</th>';
			ruleHead.appendChild(headRow);

			const emptyRow = document.createElement('tr');
			const td = document.createElement('td');
			td.colSpan = 2;
			td.className = 'text-center text-muted';
			td.textContent = message;
			emptyRow.appendChild(td);
			ruleBody.appendChild(emptyRow);
		};

		const renderMatrixTable = (colors, sizes, quantities) => {
			ruleHead.innerHTML = '';
			ruleBody.innerHTML = '';
			const safeColors = colors && colors.length > 0 ? colors : [{ code: '-', name: '-' }];
			const safeSizes = sizes && sizes.length > 0 ? sizes : [{ code: '-', name: '-' }];
			const headRow = document.createElement('tr');
			const colorHead = document.createElement('th');
			colorHead.textContent = '색상';
			colorHead.classList.add('t-left');
			headRow.appendChild(colorHead);
			safeSizes.forEach((size) => {
				const th = document.createElement('th');
				th.textContent = size.name || size.code || '-';
				headRow.appendChild(th);
			});
			ruleHead.appendChild(headRow);

			safeColors.forEach((color) => {
				const row = document.createElement('tr');
				const colorCell = document.createElement('td');
				colorCell.classList.add('t-left');
				colorCell.textContent = color.name || color.code || '-';
				row.appendChild(colorCell);
				safeSizes.forEach((size) => {
					const td = document.createElement('td');
					const key = `${color.code || ''}|${size.code || ''}`;
					const qty = quantities && Object.prototype.hasOwnProperty.call(quantities, key)
						? quantities[key]
						: '-';
					td.textContent = qty;
					row.appendChild(td);
				});
				ruleBody.appendChild(row);
			});
		};

		const loadMatrix = async (styleCode) => {
			if (!styleCode) {
				renderMatrixStatus('품번을 확인하세요.');
				return;
			}
			try {
				const response = await fetch(`/materials/spec/matrix?styleCode=${encodeURIComponent(styleCode)}`);
				if (!response.ok) {
					throw new Error('matrix');
				}
				const data = await response.json();
				const colors = Array.isArray(data.colors) ? data.colors : [];
				const sizes = Array.isArray(data.sizes) ? data.sizes : [];
				const quantities = data.quantities && typeof data.quantities === 'object' ? data.quantities : {};
				renderMatrixTable(colors, sizes, quantities);
			} catch (error) {
				renderMatrixStatus('색상/사이즈 정보를 불러오지 못했습니다.');
			}
		};

		const toCategoryCode = (category) => {
			if (category === '원자재') return '1';
			if (category === '부자재') return '2';
			return '';
		};

		const updateMaterialCodes = () => {
			const styleCode = styleInput.value.trim();
			const colorCode = colorInput.value.trim();
			if (!styleCode || !colorCode) return;

			const prefixMax = new Map();
			materials.forEach((item) => {
				if (!item.materialCode) return;
				const lastDash = item.materialCode.lastIndexOf('-');
				if (lastDash < 0) return;
				const prefix = item.materialCode.slice(0, lastDash);
				const seq = parseInt(item.materialCode.slice(lastDash + 1), 10);
				if (!Number.isNaN(seq)) {
					prefixMax.set(prefix, Math.max(prefixMax.get(prefix) || 0, seq));
				}
			});

			materials.forEach((item) => {
				const categoryCode = toCategoryCode(item.category);
				if (!categoryCode) return;
				const prefix = `${styleCode}-${colorCode}-${categoryCode}`;
				if (item.materialCode && item.materialCode.startsWith(`${prefix}-`)) return;
				const nextSeq = (prefixMax.get(prefix) || 0) + 1;
				prefixMax.set(prefix, nextSeq);
				item.materialCode = `${prefix}-${String(nextSeq).padStart(3, '0')}`;
			});
		};

		const renderPagination = (total) => {
			pagination.innerHTML = '';
			if (total <= pageSize) return;
			const totalPages = Math.ceil(total / pageSize);
			for (let i = 1; i <= totalPages; i += 1) {
				const li = document.createElement('li');
				li.className = `page-item ${i === currentPage ? 'active' : ''}`;
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'page-link';
				button.textContent = i;
				button.addEventListener('click', () => {
					currentPage = i;
					renderMaterials();
				});
				li.appendChild(button);
				pagination.appendChild(li);
			}
		};

		const buildInput = (value, placeholder, onChange, options = {}) => {
			const input = document.createElement('input');
			input.type = options.type || 'text';
			input.className = `form-control ${options.alignLeft ? 'text-start' : ''}`;
			if (options.readonly) {
				input.readOnly = true;
				input.classList.add('ms-readonly');
			}
			if (options.field) {
				input.dataset.field = options.field;
			}
			input.value = value ?? '';
			input.placeholder = placeholder || '';
			input.addEventListener('input', (event) => {
				onChange(event.target.value);
				input.classList.remove('is-invalid');
			});
			return input;
		};

		const renderMaterials = () => {
			specBody.innerHTML = '';
			const visibleItems = materials;
			if (visibleItems.length === 0) {
				const row = document.createElement('tr');
				row.innerHTML = '<td colspan="14" class="text-center text-muted">등록된 원부자재 사양서가 없습니다.</td>';
				specBody.appendChild(row);
				renderPagination(0);
				return;
			}
			updateMaterialCodes();
			const start = (currentPage - 1) * pageSize;
			const pageItems = visibleItems.slice(start, start + pageSize);
			pageItems.forEach((item, index) => {
				const tr = document.createElement('tr');
				const rowIndex = start + index;
				tr.dataset.rowIndex = rowIndex;

				const categoryTd = document.createElement('td');
				categoryTd.classList.add('t-left');
				const select = document.createElement('select');
				select.className = 'form-select text-start';
				select.dataset.field = 'category';
				['원자재', '부자재'].forEach((optionValue) => {
					const option = document.createElement('option');
					option.value = optionValue;
					option.textContent = optionValue;
					if (item.category === optionValue) {
						option.selected = true;
					}
					select.appendChild(option);
				});
				select.addEventListener('change', (event) => {
					item.category = event.target.value;
					item.materialCode = '';
					select.classList.remove('is-invalid');
					updateMaterialCodes();
					renderMaterials();
				});
				categoryTd.appendChild(select);
				tr.appendChild(categoryTd);

				const nameTd = document.createElement('td');
				nameTd.classList.add('t-left');
				nameTd.appendChild(buildInput(item.materialName, '', (value) => { item.materialName = value; }, {
					alignLeft: true,
					field: 'material_name'
				}));
				tr.appendChild(nameTd);

				const usageTd = document.createElement('td');
				usageTd.appendChild(buildInput(item.materialUsage, '', (value) => { item.materialUsage = value; }));
				tr.appendChild(usageTd);

				const specTd = document.createElement('td');
				specTd.appendChild(buildInput(item.spec, '', (value) => { item.spec = value; }));
				tr.appendChild(specTd);

				const colorTd = document.createElement('td');
				const colorGroup = document.createElement('div');
				colorGroup.className = 'input-group';
				const colorInputField = buildInput(item.materialColor, '', (value) => { item.materialColor = value; });
				const colorBtn = document.createElement('button');
				colorBtn.type = 'button';
				colorBtn.className = 'btn btn--outline';
				colorBtn.textContent = '검색';
				colorBtn.addEventListener('click', () => {
					colorTargetInput = colorInputField;
					selectedColorCode = null;
					document.getElementById('msColorKeyword').value = '';
					resetColorResults('조회 중입니다...');
					colorModal.show();
					loadColorResults('');
				});
				colorGroup.appendChild(colorInputField);
				colorGroup.appendChild(colorBtn);
				colorTd.appendChild(colorGroup);
				tr.appendChild(colorTd);

				const uomTd = document.createElement('td');
				uomTd.appendChild(buildInput(item.uom, '', (value) => { item.uom = value; }, { field: 'uom' }));
				tr.appendChild(uomTd);

				const qtyTd = document.createElement('td');
				qtyTd.appendChild(buildInput(item.qtyPerPiece, '', (value) => {
					item.qtyPerPiece = value ? parseFloat(value) : null;
				}, { type: 'number', field: 'qty_per_piece' }));
				tr.appendChild(qtyTd);

				const codeTd = document.createElement('td');
				codeTd.appendChild(buildInput(item.materialCode, '', (value) => { item.materialCode = value; }, {
					readonly: true,
					field: 'material_code'
				}));
				tr.appendChild(codeTd);

				const supplierTd = document.createElement('td');
				const supplierGroup = document.createElement('div');
				supplierGroup.className = 'input-group';
				const supplierInput = buildInput(item.supplierCode, '', (value) => { item.supplierCode = value; });
				const supplierBtn = document.createElement('button');
				supplierBtn.type = 'button';
				supplierBtn.className = 'btn btn--outline';
				supplierBtn.textContent = '검색';
				supplierBtn.addEventListener('click', () => {
					supplierTargetInput = supplierInput;
					selectedSupplierCode = null;
					document.getElementById('msSupplierKeyword').value = '';
					resetSupplierResults('조회 중입니다...');
					supplierModal.show();
					loadSupplierResults('');
				});
				supplierGroup.appendChild(supplierInput);
				supplierGroup.appendChild(supplierBtn);
				supplierTd.appendChild(supplierGroup);
				tr.appendChild(supplierTd);

				const lossTd = document.createElement('td');
				lossTd.appendChild(buildInput(item.lossRate, '', (value) => { item.lossRate = value ? parseFloat(value) : null; }, { type: 'number' }));
				tr.appendChild(lossTd);

				const orderTd = document.createElement('td');
				orderTd.appendChild(buildInput(item.orderUom, '', (value) => { item.orderUom = value; }));
				tr.appendChild(orderTd);

				const priceTd = document.createElement('td');
				priceTd.appendChild(buildInput(item.unitPrice, '', (value) => { item.unitPrice = value ? parseFloat(value) : null; }, { type: 'number' }));
				tr.appendChild(priceTd);

				const remarkTd = document.createElement('td');
				remarkTd.appendChild(buildInput(item.remark, '', (value) => { item.remark = value; }));
				tr.appendChild(remarkTd);

				const deleteTd = document.createElement('td');
				const deleteBtn = document.createElement('button');
				deleteBtn.type = 'button';
				deleteBtn.className = 'btn btn--outline btn-sm';
				deleteBtn.textContent = '삭제';
				deleteBtn.addEventListener('click', () => {
					if (item.bomId) {
						deletedIds.add(item.bomId);
					}
					materials.splice(rowIndex, 1);
					if (currentPage > 1 && (currentPage - 1) * pageSize >= materials.length) {
						currentPage -= 1;
					}
					renderMaterials();
				});
				deleteTd.appendChild(deleteBtn);
				tr.appendChild(deleteTd);

				specBody.appendChild(tr);
			});
			renderPagination(visibleItems.length);
		};

		const addNewRow = () => {
			materials.push({
				bomId: null,
				category: '원자재',
				materialName: '',
				materialUsage: '',
				spec: '',
				materialColor: '',
				uom: '',
				qtyPerPiece: null,
				materialCode: '',
				supplierCode: '',
				lossRate: null,
				orderUom: '',
				unitPrice: null,
				remark: ''
			});
			currentPage = Math.ceil(materials.length / pageSize);
			updateMaterialCodes();
			renderMaterials();
		};

		const selectFirstOption = (select) => {
			const options = Array.from(select.options);
			const validOption = options.find((option) => option.value);
			if (validOption) {
				select.value = validOption.value;
			}
			return Boolean(validOption);
		};

		const doSearch = async () => {
			const styleCode = styleInput.value.trim();
			const colorCode = colorInput.value.trim();
			const agreeCode = agreementInput.value.trim();
			if (!styleVerified) {
				alert('품번 확인 후 조회할 수 있습니다.');
				return;
			}
			if (!colorCode || !agreeCode) {
				alert('색상과 생산합의코드를 선택하세요.');
				return;
			}
			try {
				const response = await fetch(`/materials/spec/search?styleCode=${encodeURIComponent(styleCode)}&color=${encodeURIComponent(colorCode)}&agreementCode=${encodeURIComponent(agreeCode)}`);
				if (!response.ok) {
					alert('조회 중 오류가 발생했습니다.');
					return;
				}
				const data = await response.json();
				contextLoaded = true;
				styleChip.textContent = styleCode;
				materials = Array.isArray(data.materials) ? data.materials.map((item) => ({
					bomId: item.bomId,
					category: item.category || '원자재',
					materialName: item.materialName || '',
					materialUsage: item.materialUsage || '',
					spec: item.spec || '',
					materialColor: item.materialColor || '',
					uom: item.uom || '',
					qtyPerPiece: item.qtyPerPiece,
					materialCode: item.materialCode || '',
					supplierCode: item.supplierCode || '',
					lossRate: item.lossRate,
					orderUom: item.orderUom || '',
					unitPrice: item.unitPrice,
					remark: item.remark || ''
				})) : [];
				deletedIds = new Set();
				currentPage = 1;
				updateMaterialCodes();
				renderMaterials();
				addRowButton.disabled = false;
				saveButton.disabled = false;
				updateSummary();
			} catch (error) {
				alert('조회 중 오류가 발생했습니다.');
			}
		};

		const loadOptions = async (styleCode) => {
			const response = await fetch(`/materials/spec/options?styleCode=${encodeURIComponent(styleCode)}`);
			if (!response.ok) {
				throw new Error('options');
			}
			const data = await response.json();
			const colors = Array.isArray(data.colors) ? data.colors : [];
			const agreements = Array.isArray(data.agreements) ? data.agreements : [];
			updateSelectOptions(colorInput, colors, '색상 선택');
			updateSelectOptions(agreementInput, agreements, '생산합의코드 선택');
			colorInput.disabled = false;
			agreementInput.disabled = false;
			const hasColor = selectFirstOption(colorInput);
			const hasAgreement = selectFirstOption(agreementInput);
			updateSearchButtonState();
			await loadMatrix(styleCode);
			if (hasColor && hasAgreement) {
				await doSearch();
			}
		};

		const verifyStyleCode = async () => {
			const styleCode = styleInput.value.trim();
			resetContextState();
			if (!styleCode) {
				resetOptionState();
				setStatusMessage('품번을 입력하세요.', false);
				return;
			}
			try {
				const response = await fetch(`/materials/spec/verify?styleCode=${encodeURIComponent(styleCode)}`);
				if (!response.ok) {
					throw new Error('verify');
				}
				const data = await response.json();
				if (data.exists) {
					styleVerified = true;
					setStatusMessage(data.message || '품번이 확인되었습니다.', true);
					await loadOptions(styleCode);
				} else {
					resetOptionState();
					setStatusMessage(data.message || '없는 품번입니다.', false);
				}
			} catch (error) {
				resetOptionState();
				setStatusMessage('품번 확인 중 오류가 발생했습니다.', false);
			}
		};

		const clearValidationState = () => {
			specBody.querySelectorAll('.is-invalid').forEach((element) => {
				element.classList.remove('is-invalid');
			});
		};

		const fieldLabelMap = {
			material_name: '자재명',
			category: '구분',
			uom: '소요량 단위',
			qty_per_piece: '1매 소요량',
			material_code: '자재코드'
		};

		const getFieldInput = (rowIndex, field) => {
			const row = specBody.querySelector(`tr[data-row-index="${rowIndex}"]`);
			if (!row) {
				return null;
			}
			return row.querySelector(`[data-field="${field}"]`);
		};

		const applyValidationErrors = (errors) => {
			if (!errors.length) {
				return;
			}
			const firstError = errors[0];
			const targetPage = Math.floor(firstError.rowIndex / pageSize) + 1;
			if (currentPage !== targetPage) {
				currentPage = targetPage;
				renderMaterials();
			}
			errors.forEach((error) => {
				const fieldInput = getFieldInput(error.rowIndex, error.field);
				if (fieldInput) {
					fieldInput.classList.add('is-invalid');
				}
			});
			const focusTarget = getFieldInput(firstError.rowIndex, firstError.field);
			if (focusTarget) {
				focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
				focusTarget.focus();
			}
		};

		const isBlank = (value) => value == null || String(value).trim().length === 0;

		const validateMaterials = (items) => {
			const errors = [];
			items.forEach((item, index) => {
				if (!item) {
					return;
				}
				if (isBlank(item.category)) {
					errors.push({ rowIndex: index, field: 'category' });
				}
				if (isBlank(item.materialName)) {
					errors.push({ rowIndex: index, field: 'material_name' });
				}
				if (isBlank(item.uom)) {
					errors.push({ rowIndex: index, field: 'uom' });
				}
				if (item.qtyPerPiece == null || Number.isNaN(item.qtyPerPiece)) {
					errors.push({ rowIndex: index, field: 'qty_per_piece' });
				}
				if (isBlank(item.materialCode)
					&& !isBlank(item.category)
					&& !isBlank(styleInput.value)
					&& !isBlank(colorInput.value)) {
					errors.push({ rowIndex: index, field: 'material_code' });
				}
			});
			return errors;
		};

		const buildValidationAlertMessage = (error) => {
			const rowNumber = error.rowIndex + 1;
			const label = fieldLabelMap[error.field] || error.field;
			return `저장 실패: ${rowNumber}행 ${label}(${error.field})을 입력하세요`;
		};

		const submitSave = async () => {
			if (!contextLoaded) {
				alert('조회 후 저장할 수 있습니다.');
				return;
			}
			const normalizeValue = (value) => {
				if (typeof value !== 'string') {
					return value;
				}
				const trimmed = value.trim();
				return trimmed.length ? trimmed : null;
			};
			const items = materials.map((item) => ({
				...item,
				category: normalizeValue(item.category) || item.category,
				materialName: normalizeValue(item.materialName),
				materialUsage: normalizeValue(item.materialUsage),
				spec: normalizeValue(item.spec),
				materialColor: normalizeValue(item.materialColor),
				uom: normalizeValue(item.uom),
				materialCode: normalizeValue(item.materialCode),
				supplierCode: normalizeValue(item.supplierCode),
				orderUom: normalizeValue(item.orderUom),
				remark: normalizeValue(item.remark)
			}));
			const payload = {
				styleCode: styleInput.value.trim() || null,
				colorCode: colorInput.value.trim() || null,
				prdAgreeCode: agreementInput.value.trim() || null,
				items,
				deletedIds: Array.from(deletedIds)
			};
			console.log('save payload', payload);
			if (payload.items.length === 0 && payload.deletedIds.length === 0) {
				alert('저장할 데이터가 없습니다.');
				return;
			}
			clearValidationState();
			const validationErrors = validateMaterials(payload.items);
			if (validationErrors.length > 0) {
				applyValidationErrors(validationErrors);
				alert(buildValidationAlertMessage(validationErrors[0]));
				return;
			}
			const response = await fetch('/production/material-specs/save', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(payload)
			});
			if (!response.ok) {
				let errorMessage = '저장 중 오류가 발생했습니다.';
				try {
					const error = await response.json();
					if (error && Array.isArray(error.errors) && error.errors.length > 0) {
						const errors = error.errors.map((entry) => ({
							rowIndex: Math.max(0, (entry.row || 1) - 1),
							field: entry.field
						}));
						clearValidationState();
						applyValidationErrors(errors);
						errorMessage = buildValidationAlertMessage(errors[0]);
					} else if (error && error.message) {
						errorMessage = error.message;
					}
				} catch (error) {
					// ignore parse errors
				}
				alert(errorMessage);
				return;
			}
			const result = await response.json();
			if (result.success && result.savedCount > 0) {
				alert('저장되었습니다.');
				await doSearch();
			} else {
				if (Array.isArray(result.errors) && result.errors.length > 0) {
					const errors = result.errors.map((entry) => ({
						rowIndex: Math.max(0, (entry.row || 1) - 1),
						field: entry.field
					}));
					clearValidationState();
					applyValidationErrors(errors);
					alert(buildValidationAlertMessage(errors[0]));
					return;
				}
				alert(result.message || '저장에 실패했습니다.');
			}
		};

		const resetColorResults = (message = '검색어를 입력하세요.') => {
			const tbody = document.getElementById('msColorResults');
			tbody.innerHTML = `<tr><td colspan="2" class="text-center text-muted">${message}</td></tr>`;
		};

		const resetSupplierResults = (message = '검색어를 입력하세요.') => {
			const tbody = document.getElementById('msSupplierResults');
			tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">${message}</td></tr>`;
		};

		const renderCodeRows = (tbody, codes, columns) => {
			tbody.innerHTML = '';
			if (!codes || codes.length === 0) {
				const row = document.createElement('tr');
				const td = document.createElement('td');
				td.colSpan = columns;
				td.className = 'text-center text-muted';
				td.textContent = '검색 결과가 없습니다.';
				row.appendChild(td);
				tbody.appendChild(row);
				return;
			}
			codes.forEach((code) => {
				const row = document.createElement('tr');
				row.className = 'ms-modal-row';
				row.innerHTML = columns === 2
					? `<td class="t-left">${code.code || ''}</td><td class="t-left">${code.codeName || ''}</td>`
					: `<td class="t-left">${code.code || ''}</td><td class="t-left">${code.codeName || ''}</td><td class="t-left">${code.remark || ''}</td>`;
				row.addEventListener('click', () => {
					tbody.querySelectorAll('.ms-modal-row').forEach((r) => r.classList.remove('active'));
					row.classList.add('active');
					if (columns === 2) {
						selectedColorCode = code.code;
					} else {
						selectedSupplierCode = code.code;
					}
				});
				row.addEventListener('dblclick', () => {
					if (columns === 2) {
						selectedColorCode = code.code;
						applyColorSelection();
					} else {
						selectedSupplierCode = code.code;
						applySupplierSelection();
					}
				});
				tbody.appendChild(row);
			});
		};

		const fetchCodes = async (codeType, keyword) => {
			const response = await fetch(`/production/material-specs/codes?codeType=${encodeURIComponent(codeType)}&keyword=${encodeURIComponent(keyword || '')}`);
			if (!response.ok) {
				return [];
			}
			return response.json();
		};

		const loadColorResults = async (keyword) => {
			const results = await fetchCodes('COLOR', keyword);
			renderCodeRows(document.getElementById('msColorResults'), results, 2);
		};

		const loadSupplierResults = async (keyword) => {
			const results = await fetchCodes('CUSTOMER', keyword);
			renderCodeRows(document.getElementById('msSupplierResults'), results, 3);
		};

		const applyColorSelection = () => {
			if (!selectedColorCode || !colorTargetInput) {
				alert('선택된 색상이 없습니다.');
				return;
			}
			colorTargetInput.value = selectedColorCode;
			colorTargetInput.dispatchEvent(new Event('input'));
			colorModal.hide();
		};

		const applySupplierSelection = () => {
			if (!selectedSupplierCode || !supplierTargetInput) {
				alert('선택된 자재처가 없습니다.');
				return;
			}
			supplierTargetInput.value = selectedSupplierCode;
			supplierTargetInput.dispatchEvent(new Event('input'));
			supplierModal.hide();
		};

		document.getElementById('msColorSearchBtn').addEventListener('click', async () => {
			const keyword = document.getElementById('msColorKeyword').value.trim();
			loadColorResults(keyword);
		});

		document.getElementById('msColorSelectBtn').addEventListener('click', applyColorSelection);

		document.getElementById('msSupplierSearchBtn').addEventListener('click', async () => {
			const keyword = document.getElementById('msSupplierKeyword').value.trim();
			loadSupplierResults(keyword);
		});

		document.getElementById('msSupplierSelectBtn').addEventListener('click', applySupplierSelection);

		verifyButton.addEventListener('click', verifyStyleCode);
		searchButton.addEventListener('click', doSearch);
		addRowButton.addEventListener('click', addNewRow);
		saveButton.addEventListener('click', submitSave);

		styleInput.addEventListener('input', () => {
			clearStatusMessage();
			resetOptionState();
			resetContextState({ resetMatrix: true });
		});

		colorInput.addEventListener('change', () => {
			resetContextState();
			updateSearchButtonState();
		});

		agreementInput.addEventListener('change', () => {
			resetContextState();
			updateSearchButtonState();
		});

		resetContextState({ resetMatrix: true });
		resetOptionState();
		clearStatusMessage();
		/*]]>*/
	</script>
</div>
