<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<div class="mb-3">
		<h4 class="fw-bold mb-1">완제품 이동</h4>
		<p class="text-muted mb-0">창고 간 이동 관리</p>
	</div>

	<div class="kpi-cards">
		<div class="kpi-card">
			<div class="kpi-label">진행중 작업지시</div>
			<div class="kpi-value" th:text="${kpi.workOrdersInProgress}">0</div>
		</div>
		<div class="kpi-card">
			<div class="kpi-label">금일 입고</div>
			<div class="kpi-value" th:text="${kpi.todayReceipts}">0</div>
		</div>
		<div class="kpi-card">
			<div class="kpi-label">금일 출고</div>
			<div class="kpi-value" th:text="${kpi.todayShipments}">0</div>
		</div>
	</div>

	<form class="card shadow-sm mb-3">
		<div class="card-body row g-3 align-items-end">
			<div class="col-md-4">
				<label class="form-label fw-semibold">품번</label>
				<input type="text" class="form-control" placeholder="품번">
			</div>
			<div class="col-md-4">
				<label class="form-label fw-semibold">이동일자</label>
				<input type="date" class="form-control">
			</div>
			<div class="col-md-3">
				<label class="form-label fw-semibold">L/C</label>
				<input type="text" class="form-control" placeholder="창고">
			</div>
			<div class="col-md-1 d-grid">
				<button type="button" class="btn btn-dark">검색</button>
			</div>
		</div>
	</form>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="mb-0 fw-bold">이동 목록</h6>
				<span class="text-muted small" th:text="'총 ' + ${#lists.size(list)} + '건'">총 0건</span>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th>이동번호</th>
							<th>이동일자</th>
							<th>FROM L/C</th>
							<th>TO L/C</th>
							<th>품번</th>
							<th>색상</th>
							<th>사이즈</th>
							<th>수량</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(list)}">
							<td colspan="8" class="text-center text-muted">조회된 데이터가 없습니다.</td>
						</tr>
						<tr th:each="t : ${list}">
							<td th:text="${t.transferNo}">TR-001</td>
							<td th:text="${t.transferDate}">2024-01-01</td>
							<td th:text="${t.fromLocation}">WH-A</td>
							<td th:text="${t.toLocation}">WH-B</td>
							<td th:text="${t.styleNo}">ST-001</td>
							<td th:text="${t.color}">RED</td>
							<td th:text="${t.size}">L</td>
							<td th:text="${t.quantity}">30</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="pt-3 text-center text-muted small">페이징 영역</div>
		</div>
	</div>

	<section class="panel">
		<h4 class="h6 fw-bold mb-2">준비중</h4>
		<div class="text-muted small">상세 기능은 추후 추가됩니다.</div>
	</section>
</div>
