<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<div class="mb-3">
		<h4 class="fw-bold mb-1">사용자 관리</h4>
		<p class="text-muted mb-0">사용자 계정 조회 및 관리</p>
	</div>

	<form class="card shadow-sm mb-3">
		<div class="card-body row g-3 align-items-end">
			<div class="col-md-4">
				<label class="form-label fw-semibold">사원명</label>
				<input type="text" class="form-control" placeholder="사원명">
			</div>
			<div class="col-md-4">
				<label class="form-label fw-semibold">부서</label>
				<input type="text" class="form-control" placeholder="부서">
			</div>
			<div class="col-md-3">
				<label class="form-label fw-semibold">상태</label>
				<select class="form-select">
					<option selected>전체</option>
					<option>활성</option>
					<option>비활성</option>
				</select>
			</div>
			<div class="col-md-1 d-grid">
				<button type="button" class="btn btn-dark">검색</button>
			</div>
		</div>
	</form>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="mb-0 fw-bold">사용자 목록</h6>
				<span class="text-muted small" th:text="'총 ' + ${#lists.size(list)} + '건'">총 0건</span>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th>사번</th>
							<th>사원명</th>
							<th>부서</th>
							<th>아이디</th>
							<th>권한</th>
							<th>상태</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(list)}">
							<td colspan="6" class="text-center text-muted">조회된 데이터가 없습니다.</td>
						</tr>
						<tr th:each="u : ${list}">
							<td th:text="${u.empNo}">E0001</td>
							<td th:text="${u.name}">홍길동</td>
							<td th:text="${u.dept}">영업</td>
							<td th:text="${u.username}">user1</td>
							<td th:text="${u.role}">ROLE_ADMIN</td>
							<td th:text="${u.active ? '활성' : '비활성'}">활성</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="pt-3 text-center text-muted small">페이징 영역</div>
		</div>
	</div>
	<section class="panel mt-3">
		<h4 class="h6 fw-bold mb-2">준비중</h4>
		<div class="text-muted small">상세 기능은 추후 추가됩니다.</div>
	</section>
</div>
