<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="content" class="content-area container-fluid">
	<style>
		.user-manage-bar {
			background: #0f172a;
			color: #f8fafc;
			border-radius: 10px;
			padding: 10px 12px;
			display: flex;
			align-items: center;
			gap: 10px;
			overflow: hidden;
			max-height: 0;
			opacity: 0;
			transform-origin: top;
			transition: max-height 200ms ease, opacity 200ms ease;
		}

		.user-manage-bar.active {
			max-height: 60px;
			opacity: 1;
			margin-bottom: 12px;
		}

		.user-manage-bar .label {
			font-weight: 800;
			margin-right: 6px;
		}

		.user-manage-btn {
			border: 1px solid #1f2937;
			background: #111827;
			color: #f8fafc;
			padding: 6px 12px;
			border-radius: 8px;
			font-weight: 700;
			font-size: 14px;
		}

		.user-manage-btn:hover {
			background: #0b1220;
		}

		.table-sort {
			border: 0;
			background: transparent;
			padding: 0;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-weight: 800;
			color: #0f172a;
		}

		.table-sort .sort-icon {
			font-size: 12px;
			color: #9ca3af;
			transition: transform 120ms ease, color 120ms ease;
		}

		.table-sort.active .sort-icon {
			color: #0f172a;
		}

		.table-sort.desc .sort-icon {
			transform: rotate(180deg);
		}

		.view-options {
			position: relative;
		}

		.view-toggle {
			border: 1px solid #e5e7eb;
			background: #fff;
			color: #111827;
			border-radius: 8px;
			padding: 6px 10px;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-weight: 700;
			min-width: 130px;
		}

		.view-toggle .current-label {
			font-size: 13px;
		}

		.view-menu {
			position: absolute;
			right: 0;
			top: calc(100% + 6px);
			background: #fff;
			border: 1px solid #e5e7eb;
			border-radius: 10px;
			box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
			min-width: 180px;
			padding: 6px;
			display: none;
			z-index: 10;
		}

		.view-options.open .view-menu {
			display: block;
		}

		.view-menu button {
			width: 100%;
			text-align: left;
			background: transparent;
			border: 0;
			padding: 8px 10px;
			border-radius: 8px;
			font-weight: 700;
		}

		.view-menu button:hover,
		.view-menu button.active {
			background: #f3f4f6;
		}
	</style>
	<div class="mb-3">
		<h4 class="fw-bold mb-1">사용자 관리</h4>
		<p class="text-muted mb-0">사용자 계정 조회 및 관리</p>
	</div>

	<form class="card shadow-sm mb-3">
		<div class="card-body row g-3 align-items-end">
			<div class="col-md-4">
				<label class="form-label fw-semibold">사원명</label>
				<input type="text" class="form-control" placeholder="사원명">
			</div>
			<div class="col-md-4">
				<label class="form-label fw-semibold">부서</label>
				<input type="text" class="form-control" placeholder="부서">
			</div>
			<div class="col-md-3">
				<label class="form-label fw-semibold">상태</label>
				<select class="form-select">
					<option selected>전체</option>
					<option>활성</option>
					<option>비활성</option>
				</select>
			</div>
			<div class="col-md-1 d-grid">
				<button type="button" class="btn btn--primary">검색</button>
			</div>
		</div>
	</form>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="mb-0 fw-bold">사용자 목록</h6>
				<div class="d-flex align-items-center gap-2">
					<span class="text-muted small" th:text="'총 ' + ${#lists.size(list)} + '건'">총 0건</span>
					<div class="view-options" id="userViewOptions">
						<button type="button" class="view-toggle" id="viewToggleBtn">
							<i class="bi bi-eye"></i>
							<span class="current-label">전체 보기</span>
						</button>
						<div class="view-menu" id="viewMenu">
							<button type="button" data-view="active">활성 계정만 보기</button>
							<button type="button" data-view="inactive">비활성 계정만 보기</button>
							<button type="button" data-view="all" class="active">전체 보기</button>
						</div>
					</div>
					<button type="button" class="btn btn--primary btn-sm" sec:authorize="hasRole('ADMIN')">
						<i class="bi bi-plus-circle"></i> 사용자 추가
					</button>
				</div>
			</div>
			<div class="user-manage-bar" id="userManageBar">
				<span class="label">선택 항목</span>
				<button type="button" class="user-manage-btn">직급 변경</button>
				<button type="button" class="user-manage-btn">활성/비활성 변경</button>
				<button type="button" class="user-manage-btn">비밀번호 초기화</button>
				<button type="button" class="user-manage-btn">계정 잠금</button>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0 data-table">
					<thead class="table-light">
						<tr>
							<th class="text-center" style="width: 50px;">
								<input id="selectAllUsers" class="form-check-input" type="checkbox">
							</th>
							<th class="t-left"><button type="button" class="table-sort" data-key="empNo">사번 <i
										class="bi bi-caret-up-fill sort-icon"></i></button></th>
							<th class="t-left"><button type="button" class="table-sort" data-key="name">사원명 <i
										class="bi bi-caret-up-fill sort-icon"></i></button></th>
							<th class="t-left"><button type="button" class="table-sort" data-key="dept">부서 <i
										class="bi bi-caret-up-fill sort-icon"></i></button></th>
							<th class="t-left"><button type="button" class="table-sort" data-key="username">아이디 <i
										class="bi bi-caret-up-fill sort-icon"></i></button></th>
							<th class="t-left"><button type="button" class="table-sort" data-key="role">권한 <i
										class="bi bi-caret-up-fill sort-icon"></i></button></th>
							<th class="t-left"><button type="button" class="table-sort" data-key="status">상태 <i
										class="bi bi-caret-up-fill sort-icon"></i></button></th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(list)}">
							<td colspan="7" class="text-center text-muted">조회된 데이터가 없습니다.</td>
						</tr>
						<tr th:each="u : ${list}" class="user-row"
							th:attr="data-emp-no=${u.empNo}, data-name=${u.name}, data-dept=${u.dept}, data-username=${u.username}, data-role=${u.role}, data-status=${u.active ? 'active' : 'inactive'}">
							<td class="text-center">
								<input class="form-check-input user-select-checkbox" type="checkbox">
							</td>
							<td class="t-left" th:text="${u.empNo}">E0001</td>
							<td class="t-left" th:text="${u.name}">홍길동</td>
							<td class="t-left" th:text="${u.dept}">영업</td>
							<td class="t-left" th:text="${u.username}">user1</td>
							<td class="t-left" th:text="${u.role}">ROLE_ADMIN</td>
							<td class="t-left" th:text="${u.active ? '활성' : '비활성'}">활성</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="pt-3 text-center text-muted small">페이징 영역</div>
		</div>
	</div>
	<section class="panel mt-3">
		<h4 class="h6 fw-bold mb-2">준비중</h4>
		<div class="text-muted small">상세 기능은 추후 추가됩니다.</div>
	</section>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const manageBar = document.getElementById('userManageBar');
			const rowCheckboxes = Array.from(document.querySelectorAll('.user-select-checkbox'));
			const selectAll = document.getElementById('selectAllUsers');
			const sortButtons = Array.from(document.querySelectorAll('.table-sort'));
			const userRows = Array.from(document.querySelectorAll('tr.user-row'));
			const tbody = document.querySelector('table tbody');
			const viewOptions = document.getElementById('userViewOptions');
			const viewToggleBtn = document.getElementById('viewToggleBtn');
			const viewMenu = document.getElementById('viewMenu');
			const viewMenuButtons = viewMenu ? Array.from(viewMenu.querySelectorAll('button')) : [];
			let currentView = 'all';
			let sortState = {key: 'empNo', direction: 'asc'};

			const visibleCheckboxes = () => rowCheckboxes.filter(cb => !cb.closest('tr').classList.contains('d-none'));

			const updateManageBar = () => {
				if (!manageBar) return;
				const anyChecked = visibleCheckboxes().some(cb => cb.checked);
				manageBar.classList.toggle('active', anyChecked);
			};

			rowCheckboxes.forEach(cb => cb.addEventListener('change', updateManageBar));

			if (selectAll) {
				selectAll.addEventListener('change', (e) => {
					visibleCheckboxes().forEach(cb => cb.checked = e.target.checked);
					updateManageBar();
				});
			}

			const updateSortIndicators = () => {
				sortButtons.forEach(btn => {
					btn.classList.toggle('active', btn.dataset.key === sortState.key);
					btn.classList.toggle('desc', btn.dataset.key === sortState.key && sortState.direction === 'desc');
				});
			};

			const compareValues = (a, b, direction) => {
				const dir = direction === 'desc' ? -1 : 1;
				const numA = parseFloat(a);
				const numB = parseFloat(b);
				const bothNumeric = !Number.isNaN(numA) && !Number.isNaN(numB);
				if (bothNumeric) {
					return (numA - numB) * dir;
				}
				return a.localeCompare(b, 'ko-KR') * dir;
			};

			const sortRows = () => {
				if (!tbody) return;
				userRows.sort((rowA, rowB) => {
					const valA = (rowA.dataset[sortState.key] || '').toString();
					const valB = (rowB.dataset[sortState.key] || '').toString();
					return compareValues(valA, valB, sortState.direction);
				}).forEach(row => tbody.appendChild(row));
				updateSortIndicators();
			};

			sortButtons.forEach(btn => {
				btn.addEventListener('click', () => {
					const key = btn.dataset.key;
					if (sortState.key === key) {
						sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
					} else {
						sortState.key = key;
						sortState.direction = 'asc';
					}
					sortRows();
				});
			});

			const applyView = (view) => {
				currentView = view;
				userRows.forEach(row => {
					const status = row.dataset.status;
					const shouldShow = view === 'all' || status === view;
					row.classList.toggle('d-none', !shouldShow);
					if (!shouldShow) {
						const checkbox = row.querySelector('.user-select-checkbox');
						if (checkbox) checkbox.checked = false;
					}
				});
				if (selectAll) selectAll.checked = false;
				updateManageBar();
			};

			if (viewToggleBtn && viewOptions && viewMenu) {
				viewToggleBtn.addEventListener('click', () => {
					viewOptions.classList.toggle('open');
				});
				viewMenuButtons.forEach(btn => {
					btn.addEventListener('click', () => {
						viewMenuButtons.forEach(b => b.classList.remove('active'));
						btn.classList.add('active');
						const view = btn.dataset.view;
						const label = btn.textContent.trim();
						const labelTarget = viewToggleBtn.querySelector('.current-label');
						if (labelTarget) labelTarget.textContent = label;
						viewOptions.classList.remove('open');
						applyView(view);
					});
				});
				document.addEventListener('click', (e) => {
					if (!viewOptions.contains(e.target)) {
						viewOptions.classList.remove('open');
					}
				});
			}

			sortRows();
			applyView('all');
		});
	</script>
</div>
