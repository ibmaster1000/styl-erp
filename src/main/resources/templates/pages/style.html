<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>직원 검색</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/popup.css">
</head>
<body th:attr="data-target-input-id=${targetInputId},data-target-name-id=${targetNameId}">
<div class="container py-3">
    <div class="popup-card">
        <div class="popup-header">
            <h5 class="mb-0 fw-bold">직원 검색</h5>
            <div class="actions">
                <button type="submit" form="employeeSearchForm" class="btn btn--primary btn-sm">검색</button>
                <button type="button" id="btnEmployeeSelect" class="btn btn--primary btn-sm">선택</button>
            </div>
        </div>

        <form id="employeeSearchForm" method="get" class="popup-search-block">
            <div class="popup-search-row">
                <span class="popup-label">이름</span>
                <input type="text" name="name" class="form-control form-control-sm" th:value="${searchName}">
            </div>
            <div class="popup-search-row">
                <span class="popup-label">부서</span>
                <select name="dept" class="form-select form-select-sm">
                    <option value="">전체</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept}"
                            th:text="${dept}"
                            th:selected="${dept} == ${searchDept}">부서</option>
                </select>
            </div>
            <div class="popup-search-row">
                <span class="popup-label">사번</span>
                <input type="text" name="empNo" class="form-control form-control-sm" th:value="${searchEmpNo}">
            </div>
            <input type="hidden" name="targetInputId" th:value="${targetInputId}">
            <input type="hidden" name="targetNameId" th:value="${targetNameId}">
        </form>

        <div class="table-responsive table-container border rounded mt-3">
            <table class="table table-hover mb-0 align-middle data-table text-center">
                <thead class="table-light">
                <tr>
                    <th style="width: 25%" class="text-center">사번</th>
                    <th style="width: 35%" class="text-center">이름</th>
                    <th class="text-center">부서</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="3" class="text-center text-muted">조건에 해당하는 사원이 없습니다.</td>
                </tr>
                <tr th:each="emp : ${employees}"
                    class="clickable-row"
                    th:data-emp-no="${emp.empNo}"
                    th:data-name="${emp.name}"
                    th:data-dept="${emp.dept}">
                    <td class="text-center" th:text="${emp.empNo}">EMP001</td>
                    <td class="text-center" th:text="${emp.name}">홍길동</td>
                    <td class="text-center" th:text="${emp.dept}">부서</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="/js/user-popup.js"></script>
</body>
</html>
