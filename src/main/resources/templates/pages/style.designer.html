<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>디자이너 검색</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="bg-light">
	<div class="container py-4">
		<h5 class="fw-bold mb-3">담당 디자이너 검색</h5>

		<form class="card ui-card mb-3" method="get" th:action="@{/style/designer-search}">
			<div class="card-body ui-card-body row g-3 align-items-end">
				<div class="col-md-4">
					<label class="form-label fw-semibold">사원명</label>
					<input type="text" class="form-control" name="name" th:value="${name}">
				</div>
				<div class="col-md-4">
					<label class="form-label fw-semibold">사번</label>
					<input type="text" class="form-control" name="empNo" th:value="${empNo}">
				</div>
				<div class="col-md-3">
					<label class="form-label fw-semibold">부서</label>
					<input type="text" class="form-control" name="dept" th:value="${dept}">
				</div>
				<div class="col-md-1 d-grid">
					<button type="submit" class="btn btn--primary">검색</button>
				</div>
			</div>
		</form>

		<div class="card ui-card">
			<div class="card-body ui-card-body">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h6 class="mb-0 fw-bold">사원 목록</h6>
					<span class="text-muted small" th:text="'총 ' + ${#lists.size(users)} + '건'">총 0건</span>
				</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0 data-table">
						<thead class="table-light">
							<tr>
								<th class="t-left">사번</th>
								<th class="t-left">사원명</th>
								<th class="t-left">부서</th>
								<th>선택</th>
							</tr>
						</thead>
						<tbody>
							<tr th:if="${#lists.isEmpty(users)}">
								<td colspan="4" class="text-center text-muted">검색된 데이터가 없습니다.</td>
							</tr>
							<tr th:each="u : ${users}">
								<td class="t-left" th:text="${u.empNo}">E0001</td>
								<td class="t-left" th:text="${u.name}">홍길동</td>
								<td class="t-left" th:text="${u.dept}">디자인</td>
								<td>
									<button type="button" class="btn btn--primary"
										th:attr="data-emp=${u.empNo},data-name=${u.name}"
										onclick="selectDesigner(this)">선택</button>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		function selectDesigner(button) {
			if (!button || !window.opener) return;
			const empNo = button.dataset.emp;
			const name = button.dataset.name;
			if (window.opener.setDesigner) {
				window.opener.setDesigner(empNo, name);
			}
			window.close();
		}
		/*]]>*/
	</script>
</body>

</html>
