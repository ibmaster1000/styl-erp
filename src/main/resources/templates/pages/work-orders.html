<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<style>
		.wo-layout {
			display: flex;
			gap: 20px;
			align-items: stretch;
			min-height: 720px;
		}

		.wo-left,
		.wo-right {
			flex: 1 1 50%;
			max-width: 50%;
			min-width: 0;
			display: flex;
			flex-direction: column;
			gap: 12px;
			min-height: 0;
		}

		.wo-panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 16px;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
		}

		.wo-search-panel {
			max-width: 420px;
		}

		.wo-search-form {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.wo-search-row {
			display: flex;
			gap: 12px;
			align-items: flex-end;
			flex-wrap: nowrap;
		}

		.wo-search-row input {
			width: 200px;
		}

		.measure-table thead th {
			font-size: 13px;
			font-weight: 800;
			text-align: center;
			background: #f9fafb;
			position: sticky;
			top: 0;
			z-index: 1;
		}

		.measure-table tbody th {
			font-size: 13px;
			font-weight: 800;
			width: 140px;
		}

		.measure-table input {
			width: 100%;
			text-align: right;
		}

		.attachment-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
			gap: 12px;
			overflow-y: auto;
			flex: 1 1 auto;
			min-height: 0;
		}

		.attachment-card {
			border: 1px solid #e5e7eb;
			border-radius: 10px;
			overflow: hidden;
			background: #f8fafc;
			cursor: pointer;
			position: relative;
			min-height: 160px;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.attachment-card img {
			max-width: 100%;
			max-height: 100%;
			object-fit: cover;
		}

		.attachment-empty {
			color: #9ca3af;
			font-weight: 700;
		}

		.attachment-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 10px;
			margin-bottom: 8px;
		}

		.attachment-delete {
			position: absolute;
			top: 8px;
			right: 8px;
			width: 30px;
			height: 30px;
			border: none;
			border-radius: 50%;
			background: rgba(239, 68, 68, 0.9);
			color: #fff;
			font-weight: 800;
			opacity: 0;
			transition: opacity 0.2s ease;
		}

		.attachment-card:hover .attachment-delete {
			opacity: 1;
		}

		.wo-attachments-panel {
			height: 100%;
			display: flex;
			flex-direction: column;
			gap: 12px;
			min-height: 0;
		}

		.wo-attachments-panel .attachment-section {
			flex: 1 1 0;
			min-height: 0;
			display: flex;
			flex-direction: column;
		}

		.modal-backdrop {
			position: fixed;
			inset: 0;
			background: rgba(15, 23, 42, 0.55);
			backdrop-filter: blur(2px);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 1050;
			padding: 20px;
		}

		.modal-backdrop.active {
			display: flex;
		}

		.modal-body {
			background: #0f172a;
			color: #fff;
			border-radius: 14px;
			padding: 16px;
			max-width: 900px;
			width: 100%;
			position: relative;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
		}

		.modal-body img {
			width: 100%;
			max-height: 60vh;
			object-fit: contain;
			border-radius: 10px;
			background: #0b1021;
		}

		.modal-close {
			position: absolute;
			right: 16px;
			bottom: 16px;
			width: 46px;
			height: 46px;
			border-radius: 50%;
			border: none;
			background: #ef4444;
			color: #fff;
			font-weight: 800;
			box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
		}

		.save-message {
			min-height: 20px;
			font-weight: 600;
		}

		@media (max-width: 1200px) {

			.wo-left,
			.wo-right {
				max-width: 100%;
				flex-basis: 100%;
			}

			.wo-layout {
				flex-direction: column;
			}
		}
	</style>

	<div class="mb-3">
		<h4 class="fw-bold mb-1">작업지시서 관리</h4>
		<p class="text-muted mb-0">치수표와 첨부 문서를 동시에 확인하세요.</p>
	</div>
	<div class="wo-layout">
		<div class="wo-left">
			<div class="wo-panel wo-search-panel">
				<form class="wo-search-form" method="get" th:action="@{/work-orders}">
					<div class="wo-search-row">
						<div>
							<label class="form-label fw-semibold">품번</label>
							<input type="text" class="form-control" name="styleCode" th:value="${styleCode}"
								placeholder="품번 코드">
						</div>
						<div>
							<button type="submit" class="btn btn--primary">검색</button>
						</div>
					</div>
					<div class="text-danger small" th:if="${styleNotFound}">존재하지 않는 품번입니다</div>
				</form>
			</div>

			<div class="wo-panel">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<div>
						<h6 class="mb-0 fw-bold">치수표</h6>
						<span class="text-muted small">구분 × 사이즈별 입력</span>
					</div>
					<button type="button" class="btn btn--primary btn-sm" id="save-btn"
						th:disabled="${styleNotFound or #lists.isEmpty(sizeCodes)}">변경사항 저장</button>
				</div>
				<div class="save-message" id="save-message"></div>
				<div class="table-responsive" style="max-height: 420px;">
					<table class="table table-sm align-middle measure-table data-table" id="measure-table">
						<thead>
							<tr id="measure-head-row"></tr>
						</thead>
						<tbody id="measure-body"></tbody>
					</table>
				</div>
			</div>
		</div>
		<div class="wo-right">
			<div class="wo-panel wo-attachments-panel h-100">
				<div class="attachment-section">
					<div class="attachment-header">
						<div>
							<div class="fw-bold">도식화</div>
							<div class="text-muted small">등록된 도식화를 확인하세요.</div>
						</div>
					</div>
					<div class="attachment-grid" id="illustration-grid"></div>
				</div>

				<div class="attachment-section">
					<div class="attachment-header">
						<div>
							<div class="fw-bold">봉제 방법</div>
							<div class="text-muted small">등록된 봉제 방법을 확인하세요.</div>
						</div>
					</div>
					<div class="attachment-grid" id="sewing-grid"></div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal-backdrop" id="wo-preview-modal">
		<div class="modal-body">
			<img id="wo-preview-image" alt="미리보기">
			<button type="button" class="modal-close" id="wo-modal-close">×</button>
		</div>
	</div>
	<script th:inline="javascript">
		/*<![CDATA[*/
		const sizeCodes = /*[[${sizeCodes}]]*/ [];
		const sizeSpecs = /*[[${sizeSpecs}]]*/ {};
		const attachmentInfo = /*[[${attachments}]]*/ {};
		const orderId = /*[[${orderId}]]*/ null;
		const styleCode = /*[[${styleCode}]]*/ '';
		const styleNotFound = /*[[${styleNotFound}]]*/ false;

		const measureItems = [
			{ label: '총기장', key: 'totalLength' },
			{ label: '허리폭', key: 'waistWidth' },
			{ label: '다리폭', key: 'thighWidth' },
			{ label: '둔폭', key: 'hipWidth' },
			{ label: '밑길이', key: 'inseamLength' }
		];

		const measureState = {};

		const initMeasureState = () => {
			sizeCodes.forEach((size) => {
				const spec = sizeSpecs[size] || {};
				measureState[size] = {
					totalLength: spec.totalLength ?? '',
					waistWidth: spec.waistWidth ?? '',
					thighWidth: spec.thighWidth ?? '',
					hipWidth: spec.hipWidth ?? '',
					inseamLength: spec.inseamLength ?? ''
				};
			});
		};

		const renderMeasureTable = () => {
			const headRow = document.getElementById('measure-head-row');
			const body = document.getElementById('measure-body');
			headRow.innerHTML = '';
			body.innerHTML = '';

			const nameTh = document.createElement('th');
			nameTh.textContent = '구분';
			headRow.appendChild(nameTh);

			sizeCodes.forEach((size) => {
				const th = document.createElement('th');
				th.textContent = size;
				th.classList.add('text-center');
				headRow.appendChild(th);
			});

			measureItems.forEach((item) => {
				const tr = document.createElement('tr');
				const label = document.createElement('th');
				label.textContent = item.label;
				tr.appendChild(label);

				sizeCodes.forEach((size) => {
					const td = document.createElement('td');
					const input = document.createElement('input');
					input.type = 'number';
					input.step = '0.01';
					input.className = 'form-control form-control-sm';
					input.value = measureState[size]?.[item.key] ?? '';
					input.addEventListener('input', (e) => {
						measureState[size] = measureState[size] || {};
						measureState[size][item.key] = e.target.value;
					});
					td.appendChild(input);
					tr.appendChild(td);
				});
				body.appendChild(tr);
			});
		};

		const renderAttachment = (path, targetId, emptyText, type) => {
			const container = document.getElementById(targetId);
			container.innerHTML = '';
			if (!path) {
				const empty = document.createElement('div');
				empty.className = 'attachment-card attachment-empty';
				empty.textContent = emptyText;
				container.appendChild(empty);
				return;
			}
			const card = document.createElement('div');
			card.className = 'attachment-card';
			card.dataset.src = path;
			card.innerHTML = `<img src="${path}" alt="attachment">`;
			card.addEventListener('click', () => openModal(path));

			const deleteBtn = document.createElement('button');
			deleteBtn.type = 'button';
			deleteBtn.className = 'attachment-delete';
			deleteBtn.textContent = '×';
			deleteBtn.addEventListener('click', (event) => {
				event.stopPropagation();
				deleteAttachment(type);
			});
			card.appendChild(deleteBtn);
			container.appendChild(card);
		};

		const updateAttachments = () => {
			renderAttachment(attachmentInfo.illustrationPath, 'illustration-grid', '도식화가 없습니다', 'ILLUSTRATION');
			renderAttachment(attachmentInfo.sewingPath, 'sewing-grid', '봉제 방법이 없습니다', 'SEWING');
		};

		const getCsrfHeaders = () => {
			const token = document.querySelector('meta[name="_csrf"]')?.content;
			const header = document.querySelector('meta[name="_csrf_header"]')?.content;
			const headers = { 'Content-Type': 'application/json' };
			if (token && header) {
				headers[header] = token;
			}
			return headers;
		};

		const showSaveMessage = (message, success) => {
			const messageBox = document.getElementById('save-message');
			messageBox.textContent = message || '';
			messageBox.style.color = success ? '#16a34a' : '#ef4444';
		};

		const buildPayload = () => ({
			styleCode,
			specs: sizeCodes.map((size) => {
				const values = measureState[size] || {};
				const parseValue = (value) => {
					if (value === '' || value === null || value === undefined) return null;
					const parsed = Number(value);
					return Number.isNaN(parsed) ? null : parsed;
				};
				return {
					sizeCode: size,
					totalLength: parseValue(values.totalLength),
					waistWidth: parseValue(values.waistWidth),
					thighWidth: parseValue(values.thighWidth),
					hipWidth: parseValue(values.hipWidth),
					inseamLength: parseValue(values.inseamLength)
				};
			})
		});

		const saveMeasureTable = async () => {
			if (!styleCode || styleNotFound) {
				showSaveMessage('검색된 품번이 없습니다.', false);
				return;
			}
			try {
				const response = await fetch('/work-orders/save', {
					method: 'POST',
					headers: getCsrfHeaders(),
					body: JSON.stringify(buildPayload())
				});
				const data = await response.json();
				showSaveMessage(data.message, data.success);
			} catch (error) {
				showSaveMessage('저장에 실패했습니다.', false);
			}
		};

		const deleteAttachment = async (type) => {
			if (!orderId) {
				return;
			}
			const confirmMessage = type === 'ILLUSTRATION'
				? '도식화를 삭제하시겠습니까?'
				: '봉제 방법을 삭제하시겠습니까?';
			if (!confirm(confirmMessage)) {
				return;
			}
			try {
				const response = await fetch(`/work-orders/attachments?orderId=${orderId}&type=${type}`, {
					method: 'DELETE',
					headers: getCsrfHeaders()
				});
				const data = await response.json();
				if (data.success) {
					if (type === 'ILLUSTRATION') {
						attachmentInfo.illustrationPath = null;
					} else {
						attachmentInfo.sewingPath = null;
					}
					updateAttachments();
				}
			} catch (error) {
				alert('삭제에 실패했습니다.');
			}
		};

		const modal = document.getElementById('wo-preview-modal');
		const modalImg = document.getElementById('wo-preview-image');
		const openModal = (src) => {
			if (!src) return;
			modalImg.src = src;
			modal.classList.add('active');
		};
		const closeModal = () => modal.classList.remove('active');

		document.getElementById('wo-modal-close').addEventListener('click', closeModal);
		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape') closeModal();
		});
		modal.addEventListener('click', (e) => {
			if (e.target === modal) closeModal();
		});

		document.addEventListener('DOMContentLoaded', () => {
			initMeasureState();
			renderMeasureTable();
			updateAttachments();
			const saveBtn = document.getElementById('save-btn');
			if (saveBtn) {
				saveBtn.addEventListener('click', saveMeasureTable);
			}
		});
		/*]]>*/
	</script>
</div>
