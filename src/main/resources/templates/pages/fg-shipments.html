<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid">
	<div class="mb-3">
		<h4 class="fw-bold mb-1">완제품 출고</h4>
		<p class="text-muted mb-0">출고 내역 관리</p>
	</div>

	<form class="card ui-card mb-3">
		<div class="card-body ui-card-body row g-3 align-items-end">
			<div class="col-md-4">
				<label class="form-label fw-semibold">거래처</label>
				<input type="text" class="form-control" placeholder="거래처">
			</div>
			<div class="col-md-4">
				<label class="form-label fw-semibold">출고일</label>
				<input type="date" class="form-control">
			</div>
			<div class="col-md-3">
				<label class="form-label fw-semibold">품번</label>
				<input type="text" class="form-control" placeholder="품번">
			</div>
			<div class="col-md-1 d-grid">
				<button type="button" class="btn btn--primary">검색</button>
			</div>
		</div>
	</form>

	<div class="card ui-card">
		<div class="card-body ui-card-body">
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h6 class="mb-0 fw-bold">출고 목록</h6>
				<span class="text-muted small" th:text="'총 ' + ${#lists.size(list)} + '건'">총 0건</span>
			</div>
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0 data-table">
					<thead class="table-light">
						<tr>
							<th class="t-left">출고번호</th>
							<th>출고일</th>
							<th class="t-left">거래처</th>
							<th class="t-left">품번</th>
							<th class="t-left">색상</th>
							<th class="t-left">사이즈</th>
							<th>수량</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(list)}">
							<td colspan="7" class="text-center text-muted">조회된 데이터가 없습니다.</td>
						</tr>
						<tr th:each="s : ${list}">
							<td class="t-left" th:text="${s.shipmentNo}">SH-001</td>
							<td th:text="${s.shipmentDate}">2024-01-01</td>
							<td class="t-left" th:text="${s.customer}">ABC상사</td>
							<td class="t-left" th:text="${s.styleCode}">ST-001</td>
							<td class="t-left" th:text="${s.color}">RED</td>
							<td class="t-left" th:text="${s.size}">L</td>
							<td th:text="${s.quantity}">40</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="pt-3 text-center text-muted small">페이징 영역</div>
		</div>
	</div>
	<section class="panel mt-3">
		<h4 class="h6 fw-bold mb-2">준비중</h4>
		<div class="text-muted small">상세 기능은 추후 추가됩니다.</div>
	</section>
</div>
