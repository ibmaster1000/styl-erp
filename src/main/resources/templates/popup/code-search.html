<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공통 코드 검색</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body { background-color: #f8f9fa; }
        .table-container { max-height: 420px; overflow-y: auto; }
        .clickable-row { cursor: pointer; }
        .clickable-row.selected { background-color: var(--bs-primary-bg-subtle) !important; }
        .search-card { border: 1px solid #dee2e6; }
    </style>
</head>
<body>
<div class="container py-3">
    <div class="bg-white rounded shadow-sm p-3 search-card">
        <div class="d-flex align-items-center justify-content-between border-bottom pb-2 mb-3">
            <h5 class="mb-0 fw-bold">공통 코드 검색</h5>
            <div class="actions">
                <button type="submit" form="codeSearchForm" class="btn btn--primary btn-sm">검색</button>
                <button type="button" id="btnCodeSelect" class="btn btn--primary btn-sm">선택</button>
            </div>
        </div>

        <form id="codeSearchForm" method="get" class="row gy-2 gx-3 mb-3">
            <div class="col-md-3 col-6">
                <label class="form-label small fw-semibold mb-1">분류</label>
                <select class="form-select form-select-sm" name="codeType">
                    <option value="">전체</option>
                    <option th:each="type : ${codeTypes}"
                            th:value="${type}"
                            th:text="${type}"
                            th:selected="${type} == ${searchCodeType}">분류</option>
                </select>
            </div>
            <div class="col-md-3 col-6">
                <label class="form-label small fw-semibold mb-1">코드</label>
                <input type="text" name="code" class="form-control form-control-sm" th:value="${searchCode}">
            </div>
            <div class="col-md-3 col-6">
                <label class="form-label small fw-semibold mb-1">명칭</label>
                <input type="text" name="codeName" class="form-control form-control-sm" th:value="${searchCodeName}">
            </div>
            <div class="col-md-3 col-6">
                <label class="form-label small fw-semibold mb-1">비고</label>
                <input type="text" name="remark" class="form-control form-control-sm" th:value="${searchRemark}">
            </div>
        </form>

        <div class="table-responsive table-container border rounded">
            <table class="table table-hover mb-0 align-middle data-table">
                <thead class="table-light">
                <tr>
                    <th style="width: 20%" class="t-left">분류</th>
                    <th style="width: 20%" class="t-left">코드</th>
                    <th style="width: 30%" class="t-left">명칭</th>
                    <th class="t-left">비고</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(codes)}">
                    <td colspan="4" class="text-center text-muted">조건에 해당하는 코드가 없습니다.</td>
                </tr>
                <tr th:each="code : ${codes}"
                    class="clickable-row"
                    th:data-code-type="${code.codeType}"
                    th:data-code="${code.code}"
                    th:data-code-name="${code.codeName} ?: ${code.name}">
                    <td class="t-left" th:text="${code.codeType}">분류</td>
                    <td class="t-left" th:text="${code.code}">CODE</td>
                    <td class="t-left" th:text="${code.codeName} ?: ${code.name}">명칭</td>
                    <td class="t-left" th:text="${code.remark}">비고</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const codeRows = document.querySelectorAll('.clickable-row');
    const codeSelectBtn = document.getElementById('btnCodeSelect');
    let selectedCodeRow = null;

    codeRows.forEach(row => {
        row.addEventListener('click', () => {
            codeRows.forEach(r => r.classList.remove('table-primary', 'selected'));
            row.classList.add('table-primary', 'selected');
            selectedCodeRow = row;
        });
    });

    codeSelectBtn?.addEventListener('click', () => {
        if (!selectedCodeRow) {
            alert('선택된 코드가 없습니다.');
            return;
        }
        if (!window.opener || typeof window.opener.onCodeSelected !== 'function') {
            alert('부모창 콜백이 없습니다.');
            return;
        }
        const payload = {
            codeType: selectedCodeRow.dataset.codeType,
            code: selectedCodeRow.dataset.code,
            codeName: selectedCodeRow.dataset.codeName
        };
        window.opener.onCodeSelected(payload);
        window.close();
    });
</script>
</body>
</html>
