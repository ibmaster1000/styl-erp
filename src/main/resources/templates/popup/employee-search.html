<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사원 검색</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-container { max-height: 420px; overflow-y: auto; }
        .clickable-row { cursor: pointer; }
        .clickable-row.selected { background-color: var(--bs-primary-bg-subtle) !important; }
        .search-card { border: 1px solid #dee2e6; }
    </style>
</head>
<body>
<div class="container py-3">
    <div class="bg-white rounded shadow-sm p-3 search-card">
        <div class="d-flex align-items-center justify-content-between border-bottom pb-2 mb-3">
            <h5 class="mb-0 fw-bold">사원 검색</h5>
            <div class="btn-group">
                <button type="submit" form="employeeSearchForm" class="btn btn-secondary btn-sm">검색</button>
                <button type="button" id="btnEmployeeSelect" class="btn btn-primary btn-sm">선택</button>
            </div>
        </div>

        <form id="employeeSearchForm" method="get" class="row gy-2 gx-3 mb-2">
            <div class="col-md-4 col-6">
                <label class="form-label small fw-semibold mb-1">사번</label>
                <input type="text" name="empNo" class="form-control form-control-sm" th:value="${searchEmpNo}">
            </div>
            <div class="col-md-4 col-6">
                <label class="form-label small fw-semibold mb-1">이름</label>
                <input type="text" name="name" class="form-control form-control-sm" th:value="${searchName}">
            </div>
            <div class="col-md-4 col-12">
                <label class="form-label small fw-semibold mb-1">부서</label>
                <select name="dept" class="form-select form-select-sm">
                    <option value="">전체</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept}"
                            th:text="${dept}"
                            th:selected="${dept} == ${searchDept}">부서</option>
                </select>
                <div class="text-muted small mt-1">부서를 특정해서 검색할 때는 부서 자동 입력, 입력 불가</div>
            </div>
        </form>

        <div class="table-responsive table-container border rounded mt-2">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th style="width: 25%">사번</th>
                    <th style="width: 35%">이름</th>
                    <th>부서</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="3" class="text-center text-muted">조건에 해당하는 사원이 없습니다.</td>
                </tr>
                <tr th:each="emp : ${employees}"
                    class="clickable-row"
                    th:data-emp-no="${emp.empNo}"
                    th:data-name="${emp.name}"
                    th:data-dept="${emp.dept}">
                    <td th:text="${emp.empNo}">EMP001</td>
                    <td th:text="${emp.name}">홍길동</td>
                    <td th:text="${emp.dept}">부서</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const employeeRows = document.querySelectorAll('.clickable-row');
    const employeeSelectBtn = document.getElementById('btnEmployeeSelect');
    let selectedEmployeeRow = null;

    employeeRows.forEach(row => {
        row.addEventListener('click', () => {
            employeeRows.forEach(r => r.classList.remove('table-primary', 'selected'));
            row.classList.add('table-primary', 'selected');
            selectedEmployeeRow = row;
        });
    });

    employeeSelectBtn?.addEventListener('click', () => {
        if (!selectedEmployeeRow) {
            alert('선택된 사원이 없습니다.');
            return;
        }
        if (!window.opener || typeof window.opener.onEmployeeSelected !== 'function') {
            alert('부모창 콜백이 없습니다.');
            return;
        }
        const payload = {
            empNo: selectedEmployeeRow.dataset.empNo,
            name: selectedEmployeeRow.dataset.name,
            dept: selectedEmployeeRow.dataset.dept
        };
        window.opener.onEmployeeSelected(payload);
        window.close();
    });
</script>
</body>
</html>
