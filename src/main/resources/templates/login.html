<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <title>StylERP Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">

  <style>
    body{
      min-height:100vh;
      background:
        radial-gradient(1200px 600px at 20% 20%, rgba(0, 200, 255, .25), transparent 60%),
        radial-gradient(900px 500px at 80% 60%, rgba(255, 180, 0, .18), transparent 55%),
        linear-gradient(120deg, #0b1220, #0a1d1a 45%, #1b1030);
      background-attachment: fixed;
    }

    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 12px;}
    .login-card{
      width:100%;
      max-width:560px;
      border:0;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 60px rgba(0,0,0,.45);
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(10px);
    }

    .brand{display:flex;align-items:center;gap:12px;}
    .brand-badge{
      width:44px;height:44px;border-radius:12px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,#46d369,#1aa7ff);
      color:#fff;font-weight:800;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }
    .subtitle{color:#6c757d;}

    /* ✅ 탭을 "붙여서" + 선택된 탭은 흰색, 비선택은 회색 */
    .role-tabs{
      display:flex;
      border-radius:12px;
      overflow:hidden;
      border:1px solid #dee2e6;
      background:#e9ecef; /* 비선택 영역 회색 */
    }
    .role-tab{
      flex:1;
      padding:12px 12px;
      text-align:center;
      cursor:pointer;
      user-select:none;
      font-weight:700;
      color:#6c757d;
      background:#e9ecef; /* 기본(비선택) 회색 */
      border-right:1px solid #dee2e6;
    }
    .role-tab:last-child{border-right:0;}

    .role-tab.active{
      background:#fff;      /* ✅ 선택된 탭은 흰색 */
      color:#212529;
      box-shadow:0 6px 16px rgba(0,0,0,.08); /* 살짝 떠 보이게 */
    }

    /* ✅ 아이디/비번 입력칸을 "하나의 박스"처럼 붙이기 */
    .input-stack{
      border:1px solid #ced4da;
      border-radius:12px;
      overflow:hidden;
      background:#fff;
    }
    .input-stack .form-control{
      border:0;
      border-radius:0;
      padding:12px 14px;
      box-shadow:none !important;
    }
    .input-stack .form-control + .form-control{
      border-top:1px solid #ced4da; /* 가운데 구분선 */
    }

    .btn-login{
      border-radius:12px;
      padding:12px 14px;
      font-weight:800;
    }

    .help-links a{color:#868e96;text-decoration:none;font-size:.9rem;}
    .help-links a:hover{text-decoration:underline;}
  </style>
</head>

<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="p-4 p-md-5">

      <div class="brand mb-3">
        <div class="brand-badge">S</div>
        <div>
          <h3 class="m-0 fw-bold">Styl-ERP</h3>
          <div class="subtitle">재고·생산관리 시스템</div>
        </div>
      </div>

      <div th:if="${param.error != null and param.error[0] != 'not_admin'}" class="alert alert-danger mt-3">
        아이디 또는 비밀번호가 틀렸습니다.
      </div>
      <div th:if="${param.registered}" class="alert alert-success mt-3">
        회원가입이 완료되었습니다. 로그인해 주세요.
      </div>
      <div th:if="${param.logout}" class="alert alert-success mt-3">
        로그아웃 되었습니다.
      </div>
	  <div th:if="${param.error != null and param.error[0] == 'not_admin'}" class="alert alert-warning mt-3">
      		관리자 권한이 필요합니다. 일반 사용자로 로그인하거나 관리자 계정을 사용하세요.
      </div>

      <!-- ✅ 탭(붙어서) -->
      <div class="role-tabs mt-4">
        <div class="role-tab active" data-role="USER">👤 일반 사용자</div>
        <div class="role-tab" data-role="ADMIN">🛡️ 관리자</div>
      </div>

      <form th:action="@{/login}" method="post" class="mt-4">
        <input type="hidden" name="loginRole" id="loginRole" value="USER">

        <!-- ✅ 입력칸 붙이기 -->
        <div class="input-stack mb-3">
          <input type="text" name="username" class="form-control" placeholder="아이디" required>
          <input type="password" name="password" class="form-control" placeholder="비밀번호" required>
        </div>

        <button type="submit" class="btn btn--primary w-100 btn-login">
          로그인
        </button>

        <div class="d-flex justify-content-between mt-3 pt-3 border-top help-links">
          <div class="text-muted small">계정 및 비밀번호 문의는 관리자에게 요청하세요.</div>
          <a th:href="@{/signup}">회원가입</a>
        </div>
      </form>

    </div>
  </div>
</div>

<script>
  // ✅ 클릭한 쪽이 흰색(active) 되도록 토글
  const tabs = document.querySelectorAll('.role-tab');
  const roleInput = document.getElementById('loginRole');

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      roleInput.value = t.dataset.role;
    });
  });
</script>
</body>
</html>
