<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<aside th:fragment="sidebar(activeMenu)" class="sidebar">
		<div class="menu">
			<div class="menu-title">대시보드</div>
			<a th:href="@{/dashboard}" th:classappend="${activeMenu}=='dashboard' ? ' active'">
				<i class="bi bi-speedometer2"></i> 대시보드
			</a>

			<div class="menu-title" sec:authorize="hasRole('ADMIN')">사용자 관리</div>
			<a th:href="@{/users}" th:classappend="${activeMenu}=='users' ? ' active'" sec:authorize="hasRole('ADMIN')">
				<i class="bi bi-people"></i> 사용자 관리
			</a>
			<a th:href="@{/accesslog}" th:classappend="${activeMenu}=='accesslog' ? ' active'">
				<i class="bi bi-clock-history"></i> 접속 로그
			</a>

			<div class="menu-title">생산 관리</div>
			<a th:href="@{/style}" th:classappend="${activeMenu}=='style' ? ' active'">
				<i class="bi bi-tags"></i> 품번/스타일 관리
			</a>
			<a th:href="@{/production-agreements}" th:classappend="${activeMenu}=='pa' ? ' active'">
				<i class="bi bi-file-earmark-check"></i> 생산합의 관리
			</a>
			<a th:href="@{/work-orders}" th:classappend="${activeMenu}=='workorder' ? ' active'">
				<i class="bi bi-clipboard-check"></i> 작업지시서 관리
			</a>
			<a th:href="@{/production/material-specs}" th:classappend="${activeMenu}=='material-specs' ? ' active'">
				<i class="bi bi-journal-text"></i> 원부자재 사양서 등록
			</a>
			<a th:href="@{/production/material-orders}" th:classappend="${activeMenu}=='material-orders' ? ' active'">
				<i class="bi bi-cart-check"></i> 원부자재 발주
			</a>
			<a th:href="@{/production/material-receipts}"
				th:classappend="${activeMenu}=='material-receipts' ? ' active'">
				<i class="bi bi-box-arrow-in-down"></i> 원부자재 입고 등록
			</a>
			<a th:href="@{/production/material-issues}" th:classappend="${activeMenu}=='material-issues' ? ' active'">
				<i class="bi bi-arrow-left-right"></i> 원부자재 출고 등록
			</a>
			<a th:href="@{/work-orders}" th:classappend="${activeMenu}=='work-instructions' ? ' active'">
				<i class="bi bi-clipboard-data"></i> 작업지시
			</a>

			<div class="menu-title">재고 관리</div>
			<a th:href="@{/fg/receipts}" th:classappend="${activeMenu}=='receipt' ? ' active'">
				<i class="bi bi-box-arrow-in-down"></i> 완제품 입고
			</a>
			<a th:href="@{/fg/shipments}" th:classappend="${activeMenu}=='shipment' ? ' active'">
				<i class="bi bi-truck"></i> 완제품 출고
			</a>
			<a th:href="@{/fg/transfers}" th:classappend="${activeMenu}=='transfer' ? ' active'">
				<i class="bi bi-arrow-left-right"></i> 완제품 이동
			</a>

			<div class="menu-title">현황</div>
			<div class="nav-link">
				<i class="bi bi-box-seam"></i> 자재 재고 현황
			</div>
			<div class="nav-link">
				<i class="bi bi-truck"></i> 제품 출고 현황
			</div>
			<div class="nav-link">
				<i class="bi bi-box-arrow-in-down"></i> 제품 입고 현황
			</div>
			<div class="nav-link">
				<i class="bi bi-clipboard-check"></i> 작업지시서 현황
			</div>
			<div class="nav-link">
				<i class="bi bi-bar-chart"></i> 생산실적 현황
			</div>
		</div>
	</aside>
</div>
