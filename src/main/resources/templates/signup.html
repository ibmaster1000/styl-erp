<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>회원가입 - StylERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      min-height:100vh;
      background:
        radial-gradient(1200px 600px at 20% 20%, rgba(0, 200, 255, .25), transparent 60%),
        radial-gradient(900px 500px at 80% 60%, rgba(255, 180, 0, .18), transparent 55%),
        linear-gradient(120deg, #0b1220, #0a1d1a 45%, #1b1030);
      background-attachment: fixed;
    }
    .signup-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 12px;}
    .signup-card{
      width:100%;
      max-width:640px;
      border:0;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 60px rgba(0,0,0,.45);
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(10px);
    }
    .brand{display:flex;align-items:center;gap:12px;}
    .brand-badge{
      width:44px;height:44px;border-radius:12px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,#46d369,#1aa7ff);
      color:#fff;font-weight:800;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
    }
    .subtitle{color:#6c757d;}
    .btn-rounded{border-radius:12px;padding:12px 14px;font-weight:700;}
  </style>
</head>
<body>
<div class="signup-wrap">
  <div class="signup-card">
    <div class="p-4 p-md-5">
      <div class="brand mb-3">
        <div class="brand-badge">S</div>
        <div>
          <h3 class="m-0 fw-bold">Styl-ERP</h3>
          <div class="subtitle">회원가입</div>
        </div>
      </div>

      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <form th:action="@{/signup}" th:object="${signupForm}" method="post" class="mt-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">아이디 *</label>
            <input type="text" th:field="*{username}" class="form-control" placeholder="아이디를 입력하세요">
            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">비밀번호 *</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="8자 이상 비밀번호">
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">이름 *</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="이름">
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">부서</label>
            <input type="text" th:field="*{dept}" class="form-control" placeholder="부서명">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">이메일</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">전화번호</label>
            <input type="text" th:field="*{phone}" class="form-control" placeholder="010-0000-0000">
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
          <a class="text-decoration-none" th:href="@{/login}">이미 계정이 있으신가요? 로그인</a>
          <button type="submit" class="btn btn--primary btn-rounded">회원가입</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
