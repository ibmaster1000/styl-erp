<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} ?: 'StylERP'">StylERP</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		:root {
			--dark-1: #0b0f19;
			--dark-2: #121a2b;
			--dark-3: #1f2a44;
			--line: #27324d;
			--text: #e5e7eb;
			--muted: #a7b0c0;
			--accent: #7c3aed;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: #f3f4f6;
			color: #111827;
			font-family: "Noto Sans KR", "Pretendard", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
		}

		/* =====================
		   Topbar
		===================== */
		.topbar {
			height: 86px;
			background: linear-gradient(90deg, var(--dark-1), var(--dark-2));
			border-bottom: 1px solid var(--line);
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 24px;
			color: var(--text);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 14px;
		}

		.brand img {
			width: 44px;
			height: 44px;
			object-fit: contain;
		}

		.brand-text {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			font-weight: 900;
			white-space: nowrap;
		}

		.brand-title {
			font-size: 18px;
		}

		.brand-divider {
			color: var(--muted);
		}

		.brand-subtitle {
			font-size: 15px;
			color: #cbd5e1;
		}

		.userbox {
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: nowrap;
			white-space: nowrap;
		}

		.user-meta {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			font-weight: 700;
		}

		.user-name {
			font-weight: 800;
		}

		.role-divider {
			color: var(--muted);
		}

		.role {
			color: #cbd5e1;
			font-weight: 800;
		}

		.logout-form {
			margin: 0;
		}

		.logout-btn {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 8px 12px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: transparent;
			color: var(--text);
			font-weight: 800;
			white-space: nowrap;
		}

		.logout-btn:hover {
			border-color: var(--text);
		}

		/* =====================
				   Sidebar
				===================== */
		.sidebar {
			width: 260px;
			background: linear-gradient(180deg, var(--dark-1), var(--dark-2));
			color: var(--text);
			padding: 24px 18px;
			border-right: 1px solid var(--line);
			display: flex;
			flex-direction: column;
			gap: 8px;
			flex-shrink: 0;
		}

		.sidebar .menu {
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.sidebar .menu-title {
			margin: 14px 0 6px;
			font-size: 12px;
			text-transform: uppercase;
			letter-spacing: 0.6px;
			color: var(--muted);
			font-weight: 800;
		}

		.sidebar .menu-title:first-child {
			margin-top: 0;
		}

		.sidebar a,
		.sidebar .nav-link {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 10px 12px;
			border-radius: 10px;
			color: var(--text);
			font-weight: 800;
			text-decoration: none;
			border: 1px solid transparent;
			background: transparent;
			transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
		}

		.sidebar .nav-link {
			cursor: default;
		}

		.sidebar a:hover,
		.sidebar .nav-link:hover {
			background: rgba(255, 255, 255, 0.06);
			border-color: rgba(255, 255, 255, 0.08);
		}

		.sidebar a.active {
			background: rgba(124, 58, 237, 0.18);
			border-color: rgba(124, 58, 237, 0.4);
			box-shadow: 0 6px 18px rgba(124, 58, 237, 0.25);
			color: #fff;
		}

		.sidebar i {
			font-size: 16px;
		}

		/* =====================
				   Layout
				===================== */
		.layout {
			display: flex;
			min-height: calc(100vh - 86px);
		}

		.content-area {
			flex: 1;
			padding: 24px;
		}

		/* =====================
		   Panels
		===================== */
		.panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 20px;
		}

		.panel-title {
			font-size: 18px;
			font-weight: 900;
			color: #0f172a;
			margin-bottom: 16px;
		}

		/* =====================
		   Dashboard
		===================== */
		.dashboard-page {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		.kpi-cards {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 16px;
		}

		.kpi-card {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 18px 16px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 10px;
			min-height: 120px;
		}

		.kpi-label {
			font-size: 14px;
			font-weight: 800;
			color: #6b7280;
		}

		.kpi-value {
			font-size: 32px;
			font-weight: 900;
			color: #0f172a;
			line-height: 1.2;
		}

		.status-cards {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 16px;
		}

		.status-card {
			height: 110px;
			border-radius: 12px;
			border: 1px solid #e5e7eb;
			background: #ffffff;
		}

		.dashboard-page {
			padding-top: 10px;
		}

		.dashboard-layout {
			display: flex;
			flex-direction: column;
			gap: 18px;
		}

		.dashboard-page .panel {
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 20px;
			box-shadow: none;
			background: #ffffff;
		}

		.dashboard-page .panel-header {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			margin-bottom: 16px;
		}

		.dashboard-page .panel-title {
			font-size: 18px;
			font-weight: 900;
			color: #0f172a;
			letter-spacing: -0.2px;
			margin: 0;
		}

		.dashboard-page .kpi-cards {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 16px;
		}

		.dashboard-page .kpi-card {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 18px 16px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 10px;
			min-height: 120px;
			box-shadow: none;
		}

		.dashboard-page .kpi-label {
			color: #6b7280;
			font-weight: 800;
			font-size: 14px;
			letter-spacing: -0.1px;
		}

		.dashboard-page .kpi-value {
			font-size: 32px;
			font-weight: 900;
			color: #0f172a;
			line-height: 1.2;
		}

		.dashboard-page .status-panel {
			padding-top: 18px;
		}

		.dashboard-page .status-cards {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 16px;
		}

		.dashboard-page .status-card {
			height: 110px;
			border-radius: 12px;
			border: 1px solid #e5e7eb;
			background: #ffffff;
		}

		.inventory-placeholder {
			height: 440px;
			background: #f8fafc;
			border: 1px dashed #e5e7eb;
			border-radius: 10px;
		}

		@media (max-width: 1200px) {
			.dashboard-page .kpi-cards {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.dashboard-page .status-cards {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
		}

		@media (max-width: 768px) {

			.dashboard-page .kpi-cards,
			.dashboard-page .status-cards {
				grid-template-columns: 1fr;
			}
		}

		footer {
			padding: 12px;
			text-align: center;
			color: #6b7280;
			font-size: 13px;
		}

		@media (max-width: 992px) {
			.sidebar {
				display: none;
			}

			.layout {
				min-height: auto;
				flex-direction: column;
			}
		}
	</style>
</head>

<body th:with="safeContent=${content} ?: 'fragments/empty-content'">
	<header th:replace="~{fragments/header :: header(${title})}"></header>
	<div class="layout">
		<aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>
		<main class="content-area container-fluid" th:replace="~{${safeContent} :: content}"></main>
	</div>
	<footer th:replace="~{fragments/footer :: footer}"></footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
