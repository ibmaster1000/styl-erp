<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} ?: 'StylERP'">StylERP</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		:root {
			--dark-1: #0b0f19;
			--dark-2: #121a2b;
			--dark-3: #1f2a44;
			--line: #27324d;
			--text: #e5e7eb;
			--muted: #a7b0c0;
			--accent: #7c3aed;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: #f3f4f6;
			color: #111827;
			font-family: "Noto Sans KR", "Pretendard", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
		}

		/* =====================
		   Topbar
		===================== */
		.topbar {
			height: 86px;
			background: linear-gradient(90deg, var(--dark-1), var(--dark-2));
			border-bottom: 1px solid var(--line);
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 24px;
			color: var(--text);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 14px;
		}

		.brand img {
			width: 44px;
			height: 44px;
			object-fit: contain;
		}

		/* =====================
		   Layout
		===================== */
		.layout {
			display: flex;
			min-height: calc(100vh - 86px);
		}

		.content-area {
			flex: 1;
			padding: 24px;
		}

		/* =====================
		   Panels
		===================== */
		.panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 20px;
		}

		.panel-title {
			font-size: 18px;
			font-weight: 900;
			color: #0f172a;
			margin-bottom: 16px;
		}

		/* =====================
		   Dashboard
		===================== */
		.dashboard-page {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		.kpi-cards {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 16px;
		}

		.kpi-card {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 12px;
			padding: 18px 16px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 10px;
			min-height: 120px;
		}

		.kpi-label {
			font-size: 14px;
			font-weight: 800;
			color: #6b7280;
		}

		.kpi-value {
			font-size: 32px;
			font-weight: 900;
			color: #0f172a;
			line-height: 1.2;
		}

		.status-cards {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 16px;
		}

		.status-card {
			height: 110px;
			border-radius: 12px;
			border: 1px solid #e5e7eb;
			background: #ffffff;
		}

		.inventory-placeholder {
			height: 440px;
			background: #f8fafc;
			border: 1px dashed #e5e7eb;
			border-radius: 10px;
		}

		/* =====================
		   Responsive
		===================== */
		@media (max-width: 1200px) {
			.kpi-cards,
			.status-cards {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
		}

		@media (max-width: 768px) {
			.kpi-cards,
			.status-cards {
				grid-template-columns: 1fr;
			}
		}

		@media (max-width: 992px) {
			.sidebar {
				display: none;
			}

			.layout {
				flex-direction: column;
				min-height: auto;
			}
		}

		footer {
			padding: 12px;
			text-align: center;
			color: #6b7280;
			font-size: 13px;
		}
		
		/* =====================
		   Sidebar (FIX)
		===================== */
		.sidebar {
		  width: 260px;
		  flex: 0 0 260px;
		  background: linear-gradient(180deg, var(--dark-1), var(--dark-2));
		  border-right: 1px solid var(--line);
		  color: var(--text);
		  padding: 18px 14px;
		}

		.sidebar .menu-title {
		  font-size: 12px;
		  letter-spacing: -0.1px;
		  font-weight: 800;
		  color: var(--muted);
		  margin: 18px 10px 8px;
		}

		.sidebar a,
		.sidebar .nav-link {
		  display: flex;
		  align-items: center;
		  gap: 10px;
		  padding: 10px 12px;
		  margin: 4px 6px;
		  border-radius: 10px;
		  color: var(--text);
		  text-decoration: none;
		  font-weight: 700;
		  font-size: 14px;
		}

		.sidebar a:hover,
		.sidebar .nav-link:hover {
		  background: rgba(124, 58, 237, 0.15);
		  color: #fff;
		}

		.sidebar .active,
		.sidebar .nav-link.active {
		  background: rgba(124, 58, 237, 0.25);
		  border: 1px solid rgba(124, 58, 237, 0.35);
		  color: #fff;
		}
		
	</style>
</head>

<body th:with="content=${content} ?: 'dashboard'">
	<header th:replace="~{fragments/header :: header(${title})}"></header>

	<div class="layout">
		<aside th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></aside>
		<main class="content-area container-fluid"
			  th:replace="~{${content} :: content}">
		</main>
	</div>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
