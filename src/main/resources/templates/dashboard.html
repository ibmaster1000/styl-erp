<div xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="content-area container-fluid dashboard-page">
	<div class="dashboard-layout">
		<section class="panel summary-panel">
			<div class="panel-header">
				<h4 class="panel-title">현황 표시</h4>
			</div>
			<div class="kpi-cards">
				<div class="kpi-card">
					<div class="kpi-label">진행중 작업지시</div>
					<div class="kpi-value" th:text="${kpi.workOrdersInProgress}">0</div>
				</div>
				<div class="kpi-card">
					<div class="kpi-label">자재 부족</div>
					<div class="kpi-value" th:text="${kpi.materialShortage}">0</div>
				</div>
				<div class="kpi-card">
					<div class="kpi-label">금일 입고</div>
					<div class="kpi-value" th:text="${kpi.todayReceipts}">0</div>
				</div>
				<div class="kpi-card">
					<div class="kpi-label">금일 출고</div>
					<div class="kpi-value" th:text="${kpi.todayShipments}">0</div>
				</div>
			</div>
		</section>

		<section class="panel status-panel">
			<div class="panel-header">
				<h4 class="panel-title">진행 현황</h4>
			</div>
			<div class="status-cards">
				<div class="status-card"></div>
				<div class="status-card"></div>
				<div class="status-card"></div>
				<div class="status-card"></div>
			</div>
		</section>
		<section class="panel inventory-panel">
			<div class="panel-header">
				<h4 class="panel-title">전체 재고 목록</h4>
			</div>
			<div class="inventory-placeholder"></div>
		</section>
	</div>
</div>
